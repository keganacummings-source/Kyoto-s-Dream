name: Build KYOTRIPPAH
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "build/KYOTO_artefacts/Release/VST3/KYOTO.vst3" stage
          Copy-Item -Recurse "build/KYOTRIPPAHFX_artefacts/Release/VST3/KYOTRIPPAH FX.vst3" stage
          tar -a -c -f KYOTRIPPAH-Windows-VST3.zip -C stage "KYOTO.vst3" "KYOTRIPPAH FX.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: KYOTRIPPAH-Windows-VST3
          path: KYOTRIPPAH-Windows-VST3.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage bundles
        run: |
          mkdir -p stage
          cp -R "build/KYOTO_artefacts/Release/VST3/KYOTO.vst3" stage/
          cp -R "build/KYOTRIPPAHFX_artefacts/Release/VST3/KYOTRIPPAH FX.vst3" stage/
          ditto -c -k --keepParent stage KYOTRIPPAH-macOS-VST3.zip || tar -czf KYOTRIPPAH-macOS-VST3.zip -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: KYOTRIPPAH-macOS-VST3
          path: KYOTRIPPAH-macOS-VST3.zip

