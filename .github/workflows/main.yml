name: Build Kyoto's Dream
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | Compress-Archive -DestinationPath release/KyotosDream-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KyotosDream-Windows
          path: release/KyotosDream-Windows-VST3.zip
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - run: cmake --build build --config Release --parallel
      - run: |
          mkdir -p release/KyotosDream-macOS-VST3
          find build -type d -name "*.vst3" -prune -exec cp -R {} release/KyotosDream-macOS-VST3/ \;
          ditto -c -k --sequesterRsrc --keepParent release/KyotosDream-macOS-VST3 release/KyotosDream-macOS-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KyotosDream-macOS
          path: release/KyotosDream-macOS-VST3.zip
