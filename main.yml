name: Build KyotoSpxrit
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Clean build directory
        shell: pwsh
        run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | Compress-Archive -DestinationPath release/KyotoSpxrit-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KyotoSpxrit-Windows
          path: release/KyotoSpxrit-Windows-VST3.zip
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Clean build directory
        run: rm -rf build
      - name: Configure CMake (Universal macOS)
        run: cmake -S . -B build -G Xcode "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
      - name: Build VST3 targets (Universal macOS)
        run: cmake --build build --config Release --target KyotoSpxrit_VST3 KyotoSpxritFX_VST3 --parallel 2
      - run: |
          mkdir -p release/KyotoSpxrit-macOS-VST3
          find build -type d -name "*.vst3" -prune -exec cp -R {} release/KyotoSpxrit-macOS-VST3/ \;
          ditto -c -k --sequesterRsrc --keepParent release/KyotoSpxrit-macOS-VST3 release/KyotoSpxrit-macOS-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KyotoSpxrit-macOS
          path: release/KyotoSpxrit-macOS-VST3.zip
