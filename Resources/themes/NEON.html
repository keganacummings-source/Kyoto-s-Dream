<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Neon</title>
  <script type="application/sleepwell-theme">
  {
  "id": "neon",
  "name": "Neon",
  "tag": "club grid \u2014 cyan streets, magenta sky",
  "vars": {
    "--bg": "#070812",
    "--panel": "#101426",
    "--accent": "#22f0e0",
    "--accent-dim": "#0e8f86",
    "--accent-bright": "#99fff6",
    "--accent2": "#ff3dbe",
    "--text": "#e8fbff",
    "--text-dim": "#7d90a8",
    "--border": "#243044",
    "--glow": "rgba(34,240,224,0.28)",
    "--panel-2": "#0a0e1c",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "linear-gradient(180deg, rgba(255,64,200,0.08), transparent 24%), repeating-linear-gradient(90deg, rgba(32,240,224,0.05) 0 1px, transparent 1px 48px), repeating-linear-gradient(0deg, rgba(255,64,200,0.04) 0 1px, transparent 1px 48px), radial-gradient(ellipse at 50% 120%, rgba(32,240,224,0.12), transparent 50%), #06080e",
  "veil": "radial-gradient(ellipse at center, transparent 58%, rgba(4,0,16,0.55) 100%)"
}
  </script>
</head>
<body>
  <p>Neon theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
