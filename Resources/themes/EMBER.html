<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — EMBER</title>
  <script type="application/sleepwell-theme">
  {
  "id": "ember",
  "name": "EMBER",
  "tag": "coal and orange",
  "vars": {
    "--bg": "#100806",
    "--panel": "#1c100c",
    "--accent": "#ff6a2a",
    "--accent-dim": "#b03810",
    "--accent-bright": "#ffc8a8",
    "--accent2": "#ff8a4a",
    "--text": "#ffe8dc",
    "--text-dim": "#c49888",
    "--border": "#4a2818",
    "--glow": "rgba(255,106,42,0.24)",
    "--panel-2": "#0c0604",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(255,106,42,0.24), transparent 62%), linear-gradient(180deg, #1c100c, #100806)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>EMBER theme pack for SLEEPWELL.</p>
</body>
</html>
