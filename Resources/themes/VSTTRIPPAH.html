<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — VSTTRIPPAH</title>
  <script type="application/sleepwell-theme">
  {
    "id": "vsttrippah",
    "name": "VSTTRIPPAH",
    "tag": "the wine-cellar colors every VST editor must use",
    "vars": {
      "--bg": "#0e0608",
      "--panel": "#1a0c12",
      "--accent": "#c04068",
      "--accent-dim": "#7a2844",
      "--accent-bright": "#e07090",
      "--accent2": "#a02848",
      "--text": "#f4e4ea",
      "--text-dim": "#9a7884",
      "--border": "#341820",
      "--glow": "rgba(192,64,104,0.26)",
      "--panel-2": "#12080c",
      "--radius": "0px",
      "--font": "'Fredoka', 'Share Tech Mono', ui-sans-serif, sans-serif"
    },
    "scene": "radial-gradient(ellipse 48% 28% at 6% -6%, rgba(192,64,104,0.34), transparent 62%), linear-gradient(180deg, #1a0a10, #0e0608 42%, #070305)",
    "veil": "radial-gradient(ellipse at center, transparent 58%, rgba(40,8,16,0.45) 100%)"
  }
  </script>
</head>
<body>
  <p>VSTTRIPPAH theme pack. VST editors use these colors. Do not invent a new palette.</p>
</body>
</html>
