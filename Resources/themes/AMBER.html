<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Amber</title>
  <script type="application/sleepwell-theme">
  {
  "id": "amber",
  "name": "Amber",
  "tag": "sodium lamp \u2014 honey light from the floor",
  "vars": {
    "--bg": "#140e06",
    "--panel": "#24180a",
    "--accent": "#f5b042",
    "--accent-dim": "#b45309",
    "--accent-bright": "#fde68a",
    "--accent2": "#ea580c",
    "--text": "#fff7e8",
    "--text-dim": "#c4a574",
    "--border": "#4a3414",
    "--glow": "rgba(245,176,66,0.28)",
    "--panel-2": "#1a1208",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 50% 28% at 50% 110%, rgba(240,160,32,0.28), transparent 62%), radial-gradient(circle at 80% 12%, rgba(255,196,90,0.14), transparent 40%), repeating-linear-gradient(0deg, rgba(80,40,0,0.08) 0 1px, transparent 1px 4px), linear-gradient(180deg, #1c1206, #120c04)",
  "veil": "radial-gradient(ellipse at center, transparent 56%, rgba(40,20,0,0.4) 100%)"
}
  </script>
</head>
<body>
  <p>Amber theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
