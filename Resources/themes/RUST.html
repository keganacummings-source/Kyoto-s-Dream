<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Rust</title>
  <script type="application/sleepwell-theme">
  {
  "id": "rust",
  "name": "Rust",
  "tag": "oxidized iron \u2014 orange streaks, dark metal",
  "vars": {
    "--bg": "#140a07",
    "--panel": "#24140e",
    "--accent": "#e07a3d",
    "--accent-dim": "#9a4e22",
    "--accent-bright": "#fdba74",
    "--accent2": "#c2410c",
    "--text": "#f6e7dc",
    "--text-dim": "#b08974",
    "--border": "#4a2c1e",
    "--glow": "rgba(224,122,61,0.26)",
    "--panel-2": "#1a0e0a",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "repeating-linear-gradient(118deg, rgba(208,96,40,0.05) 0 2px, transparent 2px 7px), radial-gradient(ellipse 40% 30% at 8% 90%, rgba(160,64,24,0.28), transparent 60%), radial-gradient(ellipse 30% 24% at 100% 10%, rgba(90,40,20,0.35), transparent 55%), linear-gradient(180deg, #1c0e0a, #120806)",
  "veil": "radial-gradient(ellipse at center, transparent 58%, rgba(24,8,4,0.48) 100%)"
}
  </script>
</head>
<body>
  <p>Rust theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
