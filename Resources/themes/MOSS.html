<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Moss</title>
  <script type="application/sleepwell-theme">
  {
  "id": "moss",
  "name": "Moss",
  "tag": "wet forest \u2014 damp green and a little gold",
  "vars": {
    "--bg": "#08110c",
    "--panel": "#122016",
    "--accent": "#6ecf6a",
    "--accent-dim": "#3f7d3c",
    "--accent-bright": "#bbf7d0",
    "--accent2": "#d6b25e",
    "--text": "#e7f6e4",
    "--text-dim": "#7d9478",
    "--border": "#24382a",
    "--glow": "rgba(110,207,106,0.22)",
    "--panel-2": "#0c1610",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 46% 30% at 0% 20%, rgba(110,207,106,0.18), transparent 60%), radial-gradient(ellipse 36% 28% at 100% 90%, rgba(200,160,64,0.12), transparent 58%), repeating-linear-gradient(28deg, transparent 0 10px, rgba(80,120,60,0.05) 10px 11px), linear-gradient(180deg, #102016, #08100a)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(4,16,8,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>Moss theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
