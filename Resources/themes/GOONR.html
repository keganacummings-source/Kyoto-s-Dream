<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — GOONR</title>
  <script type="application/sleepwell-theme">
  {
  "id": "goonr",
  "name": "GOONR",
  "tag": "matrix rain \u2014 green scan, RGB edge",
  "vars": {
    "--bg": "#020804",
    "--panel": "#04140c",
    "--accent": "#39ff14",
    "--accent-dim": "#0d6b12",
    "--accent-bright": "#b6ff9a",
    "--accent2": "#00e5ff",
    "--text": "#d8ffd0",
    "--text-dim": "#5d8a62",
    "--border": "#145c22",
    "--glow": "rgba(57,255,20,0.35)",
    "--panel-2": "#010a04",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "linear-gradient(180deg, rgba(57,255,20,0.07), transparent 16%), repeating-linear-gradient(0deg, rgba(57,255,20,0.05) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, rgba(0,229,255,0.035) 0 1px, transparent 1px 32px), radial-gradient(ellipse at 50% 120%, rgba(0,48,12,0.65), transparent 52%), #020804",
  "veil": "radial-gradient(ellipse at center, transparent 62%, rgba(0,12,4,0.55) 100%)"
}
  </script>
</head>
<body>
  <p>GOONR theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
