<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Light</title>
  <script type="application/sleepwell-theme">
  {
  "id": "light",
  "name": "Light",
  "tag": "daylight paper \u2014 ruled desk, warm wash",
  "vars": {
    "--bg": "#efe6d6",
    "--panel": "#f7f1e6",
    "--accent": "#9a3412",
    "--accent-dim": "#7c2d12",
    "--accent-bright": "#c2410c",
    "--accent2": "#b45309",
    "--text": "#1c1410",
    "--text-dim": "#6b5344",
    "--border": "#ddcbb6",
    "--glow": "rgba(154,52,18,0.16)",
    "--panel-2": "#f3eadc",
    "--radius": "2px",
    "--font": "Georgia, 'Iowan Old Style', serif"
  },
  "scene": "radial-gradient(ellipse 50% 30% at 50% -10%, rgba(255,248,236,0.9), transparent 60%), repeating-linear-gradient(0deg, rgba(90,60,40,0.05) 0 1px, transparent 1px 28px), linear-gradient(180deg, #f7f1e6, #e7dccb)",
  "veil": "radial-gradient(ellipse at center, transparent 64%, rgba(120,90,60,0.12) 100%)"
}
  </script>
</head>
<body>
  <p>Light theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
