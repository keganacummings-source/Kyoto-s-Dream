<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — PAPER</title>

  "id": "paper",
  "name": "PAPER",
  "tag": "off-white desk",
  "vars": {
    "--bg": "#efe8dc",
    "--panel": "#f7f2ea",
    "--accent": "#b4482c",
    "--accent-dim": "#8a3420",
    "--accent-bright": "#7a2414",
    "--accent2": "#c46a48",
    "--text": "#2a221c",
    "--text-dim": "#7a6e62",
    "--border": "#d8d0c4",

    "--panel-2": "#e7e0d4",
    "--radius": "8px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"

  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(180,72,44,0.16), transparent 62%), linear-gradient(180deg, #f7f2ea, #efe8dc)",

<body>
  <p>PAPER theme pack for SLEEPWELL.</p>

</html>
