<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Bloodmoon</title>
  <script type="application/sleepwell-theme">
  {
  "id": "bloodmoon",
  "name": "Bloodmoon",
  "tag": "eclipse \u2014 one red moon, black sky",
  "vars": {
    "--bg": "#070203",
    "--panel": "#16080c",
    "--accent": "#e23a4a",
    "--accent-dim": "#8a1424",
    "--accent-bright": "#ff8a90",
    "--accent2": "#ffd0c8",
    "--text": "#f8e8e6",
    "--text-dim": "#a07878",
    "--border": "#3a1820",
    "--glow": "rgba(226,58,74,0.28)",
    "--panel-2": "#100408",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(circle at 78% 16%, rgba(255,214,206,0.95) 0 14px, rgba(196,36,48,0.55) 16px 42px, rgba(60,6,12,0.28) 44px 86px, transparent 110px), radial-gradient(ellipse 70% 36% at 50% 110%, rgba(90,0,16,0.45), transparent 62%), linear-gradient(185deg, #050103 0%, #140206 48%, #070203 100%)",
  "veil": "radial-gradient(ellipse at center, transparent 52%, rgba(40,0,8,0.5) 100%)"
}
  </script>
</head>
<body>
  <p>Bloodmoon theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
