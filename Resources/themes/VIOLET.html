<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Violet</title>
  <script type="application/sleepwell-theme">
  {
  "id": "violet",
  "name": "Violet",
  "tag": "ultraviolet room \u2014 bruise purple nebula",
  "vars": {
    "--bg": "#0c0814",
    "--panel": "#181028",
    "--accent": "#c084fc",
    "--accent-dim": "#7e22ce",
    "--accent-bright": "#e9d5ff",
    "--accent2": "#a855f7",
    "--text": "#f3e8ff",
    "--text-dim": "#a78bb8",
    "--border": "#342450",
    "--glow": "rgba(192,132,252,0.28)",
    "--panel-2": "#120c1c",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 32% at 15% 10%, rgba(180,108,255,0.22), transparent 60%), radial-gradient(ellipse 32% 28% at 90% 80%, rgba(80,40,180,0.28), transparent 62%), repeating-linear-gradient(0deg, rgba(180,108,255,0.035) 0 1px, transparent 1px 7px), linear-gradient(180deg, #140c22, #0c0814)",
  "veil": "radial-gradient(ellipse at center, transparent 58%, rgba(16,6,32,0.5) 100%)"
}
  </script>
</head>
<body>
  <p>Violet theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
