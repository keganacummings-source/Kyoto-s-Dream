<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Default</title>
  <script type="application/sleepwell-theme">
  {
  "id": "default",
  "name": "Default",
  "tag": "night lamp \u2014 a red glow, no splatter",
  "vars": {
    "--bg": "#0a0a0a",
    "--panel": "#141414",
    "--accent": "#e62020",
    "--accent-dim": "#a01818",
    "--accent-bright": "#ff5555",
    "--accent2": "#ff3344",
    "--text": "#f4f4f4",
    "--text-dim": "#9a9a9a",
    "--border": "#2c2c2c",
    "--glow": "rgba(230,32,32,0.22)",
    "--panel-2": "#0e0e0e",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 42% 22% at 50% -8%, rgba(230,32,32,0.18), transparent 64%), repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px), linear-gradient(180deg, #141414, #070707)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%)"
}
  </script>
</head>
<body>
  <p>Default theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
