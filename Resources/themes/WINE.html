<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Wine</title>
  <script type="application/sleepwell-theme">
  {
  "id": "wine",
  "name": "Wine",
  "tag": "cellar \u2014 bottles in the dark, one lamp",
  "vars": {
    "--bg": "#12060c",
    "--panel": "#241018",
    "--accent": "#a33b5c",
    "--accent-dim": "#6e243c",
    "--accent-bright": "#e7b0c0",
    "--accent2": "#7a2038",
    "--text": "#f6e6ea",
    "--text-dim": "#b08a96",
    "--border": "#3d2030",
    "--glow": "rgba(163,59,92,0.24)",
    "--panel-2": "#180810",
    "--radius": "2px",
    "--font": "Georgia, 'Iowan Old Style', serif"
  },
  "scene": "radial-gradient(ellipse 28% 40% at 14% 78%, rgba(90,20,36,0.55), transparent 70%), radial-gradient(ellipse 18% 22% at 84% 30%, rgba(192,64,104,0.2), transparent 70%), radial-gradient(ellipse 50% 18% at 50% 0%, rgba(160,60,80,0.18), transparent 70%), linear-gradient(180deg, #16080e, #0c0608)",
  "veil": "radial-gradient(ellipse at center, transparent 58%, rgba(24,6,10,0.48) 100%)"
}
  </script>
</head>
<body>
  <p>Wine theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
