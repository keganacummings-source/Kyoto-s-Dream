<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Sulfur</title>
  <script type="application/sleepwell-theme">
  {
  "id": "sulfur",
  "name": "Sulfur",
  "tag": "chemical haze \u2014 sick lime over black",
  "vars": {
    "--bg": "#070804",
    "--panel": "#12180c",
    "--accent": "#c6f531",
    "--accent-dim": "#6d8f14",
    "--accent-bright": "#eaff9a",
    "--accent2": "#d24a22",
    "--text": "#f3f8d8",
    "--text-dim": "#8d9a68",
    "--border": "#2c3814",
    "--glow": "rgba(198,245,49,0.22)",
    "--panel-2": "#0c1008",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"

  "scene": "radial-gradient(ellipse 36% 22% at 12% 8%, rgba(200,255,51,0.16), transparent 62%), radial-gradient(ellipse 40% 30% at 100% 100%, rgba(230,32,32,0.12), transparent 55%), repeating-linear-gradient(0deg, rgba(200,255,51,0.04) 0 1px, transparent 1px 5px), linear-gradient(180deg, #12160a, #070804)",

</head>
<body>
  <p>Sulfur theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
