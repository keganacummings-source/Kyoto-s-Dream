<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Ice</title>
  <script type="application/sleepwell-theme">
  {
  "id": "ice",
  "name": "Ice",
  "tag": "frost glass \u2014 pale cyan, cold corners",
  "vars": {
    "--bg": "#07141a",
    "--panel": "#10242c",
    "--accent": "#9aebf5",
    "--accent-dim": "#3d8b9c",
    "--accent-bright": "#e0fbff",
    "--accent2": "#67c6de",
    "--text": "#e7f7fb",
    "--text-dim": "#7f9aa4",
    "--border": "#1e3a44",
    "--glow": "rgba(154,235,245,0.22)",
    "--panel-2": "#0c1c22",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "linear-gradient(180deg, rgba(200,244,255,0.08), transparent 22%), radial-gradient(ellipse 36% 20% at 10% 0%, rgba(142,224,240,0.18), transparent 62%), radial-gradient(ellipse 40% 28% at 100% 100%, rgba(80,140,180,0.16), transparent 60%), repeating-linear-gradient(0deg, rgba(200,240,255,0.035) 0 1px, transparent 1px 9px), linear-gradient(180deg, #102028, #081014)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(4,16,24,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>Ice theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
