<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — DAWN</title>
  <script type="application/sleepwell-theme">
  {
  "id": "dawn",
  "name": "DAWN",
  "tag": "first light — warm paper, copper line",
  "vars": {
    "--bg": "#1a120c",
    "--panel": "#2a1c14",
    "--accent": "#e8a05a",
    "--accent-dim": "#a86830",
    "--accent-bright": "#ffd2a0",
    "--accent2": "#c46a3a",
    "--text": "#f6efe6",
    "--text-dim": "#b9a48f",
    "--border": "#4a3424",
    "--glow": "rgba(232,160,90,0.24)",
    "--panel-2": "#140e0a",
    "--radius": "10px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(232,160,90,0.24), transparent 62%), linear-gradient(180deg, #2a1c14, #1a120c)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>DAWN theme pack for SLEEPWELL.</p>
</body>
</html>
