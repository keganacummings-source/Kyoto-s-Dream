<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — INK</title>
  <script type="application/sleepwell-theme">
  {
  "id": "ink",
  "name": "INK",
  "tag": "black paper, blue ink",
  "vars": {
    "--bg": "#07080c",
    "--panel": "#101218",
    "--accent": "#6ec1ff",
    "--accent-dim": "#2a6ea8",
    "--accent-bright": "#d7f1ff",
    "--accent2": "#8fd0ff",
    "--text": "#e7f3ff",
    "--text-dim": "#8aa0b4",
    "--border": "#243040",
    "--glow": "rgba(110,193,255,0.22)",
    "--panel-2": "#090b10",
    "--radius": "2px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(110,193,255,0.22), transparent 62%), linear-gradient(180deg, #101218, #07080c)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>INK theme pack for SLEEPWELL.</p>
</body>
</html>
