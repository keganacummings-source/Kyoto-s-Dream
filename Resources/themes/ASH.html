<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Ash</title>
  <script type="application/sleepwell-theme">
  {
  "id": "ash",
  "name": "Ash",
  "tag": "cold smoke \u2014 steel grey, drifting ash",
  "vars": {
    "--bg": "#12151c",
    "--panel": "#1b212b",
    "--accent": "#9bb4c8",
    "--accent-dim": "#5d7386",
    "--accent-bright": "#d5e6f2",
    "--accent2": "#7f96aa",
    "--text": "#e7eef4",
    "--text-dim": "#8b97a6",
    "--border": "#2c3542",
    "--glow": "rgba(155,180,200,0.2)",
    "--panel-2": "#10141b",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 26% at 18% 0%, rgba(180,190,200,0.16), transparent 60%), radial-gradient(ellipse 30% 40% at 90% 100%, rgba(40,48,58,0.55), transparent 60%), repeating-linear-gradient(115deg, transparent 0 12px, rgba(255,255,255,0.02) 12px 13px), linear-gradient(180deg, #1a1e26, #0c0e14)",
  "veil": "radial-gradient(ellipse at center, transparent 55%, rgba(8,10,14,0.45) 100%)"
}
  </script>
</head>
<body>
  <p>Ash theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
