<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Void</title>
  <script type="application/sleepwell-theme">
  {
  "id": "void",
  "name": "Void",
  "tag": "deep space \u2014 almost black, two distant stars",
  "vars": {
    "--bg": "#03050c",
    "--panel": "#0a1020",
    "--accent": "#7aa2e3",
    "--accent-dim": "#345084",
    "--accent-bright": "#dbe7ff",
    "--accent2": "#4c6cb5",
    "--text": "#e6eefc",
    "--text-dim": "#7d8eae",
    "--border": "#1a2740",
    "--glow": "rgba(122,162,227,0.22)",
    "--panel-2": "#060a14",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(circle at 72% 22%, rgba(220,230,255,0.85) 0 1px, rgba(120,160,220,0.25) 2px 3px, transparent 8px), radial-gradient(circle at 30% 70%, rgba(180,200,255,0.5) 0 1px, transparent 4px), radial-gradient(ellipse 60% 40% at 50% 100%, rgba(20,40,80,0.45), transparent 60%), linear-gradient(180deg, #02040a, #04060c 50%, #010208)",
  "veil": "radial-gradient(ellipse at center, transparent 46%, rgba(0,0,8,0.72) 100%)"
}
  </script>
</head>
<body>
  <p>Void theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
