<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — GRAPHITE</title>
  <script type="application/sleepwell-theme">
  {
  "id": "graphite",
  "name": "GRAPHITE",
  "tag": "neutral dark",
  "vars": {
    "--bg": "#101010",
    "--panel": "#1a1a1a",
    "--accent": "#e8e8e8",
    "--accent-dim": "#8a8a8a",
    "--accent-bright": "#ffffff",
    "--accent2": "#bdbdbd",
    "--text": "#f2f2f2",
    "--text-dim": "#9a9a9a",
    "--border": "#333333",
    "--glow": "rgba(255,255,255,0.12)",
    "--panel-2": "#0c0c0c",
    "--radius": "0px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(255,255,255,0.12), transparent 62%), linear-gradient(180deg, #1a1a1a, #101010)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>GRAPHITE theme pack for SLEEPWELL.</p>
</body>
</html>
