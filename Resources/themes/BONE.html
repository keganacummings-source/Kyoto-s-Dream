<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — Bone</title>
  <script type="application/sleepwell-theme">
  {
  "id": "bone",
  "name": "Bone",
  "tag": "ivory studio \u2014 dry parchment on charcoal",
  "vars": {
    "--bg": "#161310",
    "--panel": "#24201b",
    "--accent": "#f0e2c8",
    "--accent-dim": "#a89878",
    "--accent-bright": "#fff8ea",
    "--accent2": "#d4b483",
    "--text": "#f7f1e6",
    "--text-dim": "#a39888",
    "--border": "#3a332c",
    "--glow": "rgba(240,226,200,0.16)",
    "--panel-2": "#1c1814",
    "--radius": "2px",
    "--font": "Georgia, 'Iowan Old Style', serif"
  },
  "scene": "radial-gradient(ellipse 55% 24% at 50% 0%, rgba(255,244,220,0.08), transparent 60%), repeating-linear-gradient(90deg, transparent 0 18px, rgba(232,216,184,0.04) 18px 19px), linear-gradient(180deg, #221e1a, #141210)",
  "veil": "radial-gradient(ellipse at center, transparent 62%, rgba(20,16,12,0.4) 100%)"
}
  </script>
</head>
<body>
  <p>Bone theme pack for SLEEPWELL. Colors, scene, and veil live in the script tag.</p>
</body>
</html>
