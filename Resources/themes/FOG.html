<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLEEPWELL theme — FOG</title>
  <script type="application/sleepwell-theme">
  {
  "id": "fog",
  "name": "FOG",
  "tag": "gray mist, soft edges",
  "vars": {
    "--bg": "#121416",
    "--panel": "#1c2024",
    "--accent": "#c5d0d6",
    "--accent-dim": "#7d8c96",
    "--accent-bright": "#ffffff",
    "--accent2": "#9eb0ba",
    "--text": "#eef2f4",
    "--text-dim": "#9aa6ae",
    "--border": "#343c42",
    "--glow": "rgba(197,208,214,0.18)",
    "--panel-2": "#0e1012",
    "--radius": "12px",
    "--font": "'Share Tech Mono', ui-monospace, monospace"
  },
  "scene": "radial-gradient(ellipse 40% 22% at 50% -6%, rgba(197,208,214,0.18), transparent 62%), linear-gradient(180deg, #1c2024, #121416)",
  "veil": "radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.42) 100%)"
}
  </script>
</head>
<body>
  <p>FOG theme pack for SLEEPWELL.</p>
</body>
</html>
