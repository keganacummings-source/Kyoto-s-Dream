<script id="dreamdaw-ui-bridge">
(function(){
  window.__SW_SKIP_DOWNLOAD=true;
  window._DREAM_SAVE_ONLY=true;
  function isSoundSaveControl(el){
    if(!el||el.nodeType!==1)return false;
    var t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim().toLowerCase();
    return /\b(export|save)\b/.test(t) && /\b(wav|audio|sound|sample|tape|session|one[- ]shot|stem|note|4 bar|8 bar)\b/.test(t);
  }
  function scrub(root){(root||document).querySelectorAll('button,a,[role="button"]').forEach(function(el){if(isSoundSaveControl(el))el.remove();});}
  function bindDrop(input){
    if(!input||input.__dreamDropBound)return; input.__dreamDropBound=true;
    var target=input.closest('label,.dropzone,[data-drop],.slot,.sample-slot,.sample-pad,.track,.lane')||input.parentElement||input;
    ['dragenter','dragover'].forEach(function(ev){target.addEventListener(ev,function(e){if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();e.stopPropagation();target.classList.add('sw-drop-active');},{passive:false});});
    ['dragleave','drop'].forEach(function(ev){target.addEventListener(ev,function(e){if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}}target.classList.remove('sw-drop-active');},{passive:false});});
  }
  function init(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}
  document.addEventListener('DOMContentLoaded',init);
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);});}).observe(document.documentElement,{subtree:true,childList:true});})();
})();

<script id="dreamdaw-clean-runtime">
(function(){
  'use strict';
  function setKnob(input){
    if(!input||input.type!=='range')return;
    var min=parseFloat(input.min), max=parseFloat(input.max), val=parseFloat(input.value);

    var p=Math.max(0,Math.min(75,(val-min)/(max-min)*75));
    input.style.setProperty('--knob-p',p.toFixed(2));
    var wrap=input.parentElement&&input.parentElement.classList.contains('knob-wrap')?input.parentElement:null;
    if(wrap){var v=wrap.querySelector('.knob-value');if(v){var nt=String(Math.abs(val)>=100?Math.round(val):Number(val.toFixed(2)));if(v.textContent!==nt)v.textContent=nt;}}
  }
  function enhance(root){
    (root||document).querySelectorAll('input[type=range]').forEach(function(input){
      if(input.dataset.dreamKnob==='1'){setKnob(input);return;}
      input.dataset.dreamKnob='1';
      var parent=input.parentElement;
      if(parent && parent.classList.contains('knob-wrap')){setKnob(input);return;}
      var wrap=document.createElement('span');wrap.className='knob-wrap';
      input.replaceWith(wrap);wrap.appendChild(input);
      var value=document.createElement('span');value.className='knob-value';wrap.appendChild(value);
      input.addEventListener('input',function(){setKnob(input)},{passive:true});
      input.addEventListener('change',function(){setKnob(input)},{passive:true});
      setKnob(input);
    });
  }
  function cleanLearning(){
    document.querySelectorAll('.learn-btn,.learn-dock,#learnBtn,#learnBtnB,#learnDock').forEach(function(el){el.setAttribute('aria-hidden','true');});
  }
  function requestFit(){
    try{
      var r=document.documentElement.getBoundingClientRect();
      var w=Math.max(420,Math.ceil(r.width||document.body.scrollWidth||0));
      var h=Math.max(260,Math.ceil(r.height||document.body.scrollHeight||0));
      if(window.__JUCE__&&window.__JUCE__.backend){
        try{window.__JUCE__.backend.emitEvent('requestResize',{width:w,height:h});}catch(_){ }
        try{window.__JUCE__.backend.emitEvent('setSize',{width:w,height:h});}catch(_){ }
      }
      try{window.parent.postMessage({type:'DREAMDAW_RESIZE',width:w,height:h},'*');}catch(_){ }
    }catch(_){ }
  }

  function fitToHost(){
    try{
      var app=document.querySelector('.app,.machine,.machine-shell'); if(!app) return;
      app.style.zoom='1';
      var aw=document.documentElement.clientWidth||window.innerWidth;
      var ah=document.documentElement.clientHeight||window.innerHeight;
      var sw=Math.max(app.scrollWidth,app.getBoundingClientRect().width);
      var sh=Math.max(app.scrollHeight,app.getBoundingClientRect().height);
      var scale=Math.min(1,(aw-4)/Math.max(1,sw),(ah-4)/Math.max(1,sh));
      if(scale<0.995) app.style.zoom=Math.max(.68,scale.toFixed(3));
      requestFit();
    }catch(_){}
  }

  function init(){enhance();cleanLearning();requestFit();fitToHost();setTimeout(requestFit,80);setTimeout(fitToHost,120);setTimeout(requestFit,300);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

<body>
  <div class="app">
    <div class="hdr">
      <h1>DREAMFLUTE</h1>
      <p class="sub">Melted wax flute · soft air · one-shot export at bar length</p>
      <div class="hdr-actions">
        <button type="button" id="randBtn">RANDOM</button>
        <div class="bar-sel">
          <span style="font-size:0.62rem;color:var(--text-dim)">SHOT BARS</span>
          <button type="button" data-bars="1">1</button>
          <button type="button" data-bars="2" class="on">2</button>
          <button type="button" data-bars="3">3</button>
          <button type="button" data-bars="4">4</button>
        </div>
        <button type="button" class="primary" id="expNote">EXPORT ONE-SHOT</button>
        <button type="button" class="primary" id="expHit">1HIT</button>
      </div>
    </div>
    <div class="work">
      <div class="panel-melt">
        <div class="panel-title">Body · soft air</div>
        <div class="row">
          <label>CUTOFF<input id="cut" type="range" min="600" max="9000" value="2400"></label>
          <label>AIR<input id="air" type="range" min="0" max="40" value="10"></label>
          <label>VIBRATO<input id="vib" type="range" min="0" max="30" value="13"></label>
          <label>ATTACK<input id="atk" type="range" min="10" max="400" value="85"></label>
          <label>RELEASE<input id="rel" type="range" min="120" max="3000" value="950"></label>
          <label>LEVEL<input id="vol" type="range" min="8" max="70" value="20"></label>
        </div>
      </div>
      <div class="panel-melt">
        <div class="panel-title">Wax FX · toggle on · export matches playback</div>
        <div class="fx-grid" id="fxGrid">
          <button type="button" class="fx-chip" data-fx="melt">MELT</button>
          <button type="button" class="fx-chip" data-fx="drip">DRIP</button>
          <button type="button" class="fx-chip" data-fx="mist">MIST</button>
          <button type="button" class="fx-chip" data-fx="tape">TAPE</button>
          <button type="button" class="fx-chip" data-fx="chorus">CHORUS</button>
          <button type="button" class="fx-chip" data-fx="warm">WARM</button>
        </div>
        <div class="row" style="margin-top:10px">
          <label>MELT AMT<input id="meltAmt" type="range" min="0" max="100" value="52"></label>
          <label>DRIP RATE<input id="dripRate" type="range" min="0.1" max="2.5" value="0.4" step="0.05"></label>
          <label>SPACE<input id="space" type="range" min="0" max="90" value="58"></label>
          <label>WOBBLE<input id="wobble" type="range" min="0" max="50" value="20"></label>
        </div>
      </div>
      <div class="panel-melt">
        <div class="panel-title">Keys · A W S E D F T G Y H U J · Space = middle C</div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="status" id="status">DREAMFLUTE · melted wax · soft air · export full note + tail</div>
    </div>
  </div>
<script>
(function () {
  const NOTES = [60,62,64,65,67,69,71,72,74,76,77,79];
  const KEYS = 'awsedftgyhuj';
  let ctx, master, dryGain, voices = new Map(), held = new Set();
  let lastNote = 60;
  let exportBars = 2;
  const fxEnabled = { melt: false, drip: false, mist: false, tape: false, chorus: false, warm: false };
  let bus = {}; // shared live FX bus nodes

  function val(id, d) {
    const el = document.getElementById(id);
    return el ? parseFloat(el.value) : d;
  }
  function set(id, v) {
    const el = document.getElementById(id);
    if (el) el.value = v;
  }
  function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function ac() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.20;
      dryGain = ctx.createGain();
      dryGain.gain.value = 1;

      // Master chain: dry -> meltFilt -> warmFilt -> shaper -> master
      const meltFilt = ctx.createBiquadFilter();
      meltFilt.type = 'lowpass';
      meltFilt.frequency.value = 9000;
      meltFilt.Q.value = 0.7;

      const warmFilt = ctx.createBiquadFilter();
      warmFilt.type = 'lowpass';
      warmFilt.frequency.value = 12000;
      warmFilt.Q.value = 0.5;

      const sh = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const x = (i / 128) - 1;
        curve[i] = Math.tanh(x * 1.05);
      }
      sh.curve = curve;

      dryGain.connect(meltFilt);
      meltFilt.connect(warmFilt);
      warmFilt.connect(sh);
      sh.connect(master);
      master.connect(ctx.destination);

      // MIST delay tank from meltFilt
      const delay = ctx.createDelay(1.5);
      delay.delayTime.value = 0.24;
      const delayG = ctx.createGain();
      delayG.gain.value = 0;
      const fb = ctx.createGain();
      fb.gain.value = 0.3;
      const dlp = ctx.createBiquadFilter();
      dlp.type = 'lowpass';
      dlp.frequency.value = 2800;
      meltFilt.connect(delayG);
      delayG.connect(delay);
      delay.connect(fb);
      fb.connect(dlp);
      dlp.connect(delay);
      delay.connect(master);

      // CHORUS
      const c1 = ctx.createDelay(0.05);
      const c2 = ctx.createDelay(0.05);
      c1.delayTime.value = 0.013;
      c2.delayTime.value = 0.022;
      const cG = ctx.createGain();
      cG.gain.value = 0;
      const cLfo = ctx.createOscillator();
      cLfo.frequency.value = 0.4;
      const cLfoG = ctx.createGain();
      cLfoG.gain.value = 0.0035;
      cLfo.connect(cLfoG);
      cLfoG.connect(c1.delayTime);
      cLfoG.connect(c2.delayTime);
      cLfo.start();
      meltFilt.connect(cG);
      cG.connect(c1);
      cG.connect(c2);
      c1.connect(master);
      c2.connect(master);

      // MELT LFO on filter
      const meltLfo = ctx.createOscillator();
      meltLfo.frequency.value = 0.11;
      const meltLfoG = ctx.createGain();
      meltLfoG.gain.value = 0;
      meltLfo.connect(meltLfoG);
      meltLfoG.connect(meltFilt.frequency);
      meltLfo.start();

      // DRIP on master gain (subtle)
      const dripLfo = ctx.createOscillator();
      dripLfo.type = 'sine';
      dripLfo.frequency.value = 0.4;
      const dripG = ctx.createGain();
      dripG.gain.value = 0;
      dripLfo.connect(dripG);
      dripG.connect(master.gain);
      dripLfo.start();

      // TAPE shared detune LFO (connected per-voice)
      const tapeLfo = ctx.createOscillator();
      tapeLfo.frequency.value = 0.65;
      const tapeG = ctx.createGain();
      tapeG.gain.value = 0;
      tapeLfo.connect(tapeG);
      tapeLfo.start();

      bus = {
        meltFilt, warmFilt, sh, delay, delayG, fb, dlp,
        cG, meltLfoG, dripLfo, dripG, tapeLfo, tapeG
      };
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function applyFxState() {
    if (!bus.delayG || !ctx) return;
    const t = ctx.currentTime;
    const space = val('space', 45) / 100;
    const meltAmt = val('meltAmt', 40) / 100;
    const dripRate = val('dripRate', 0.4);
    const wobble = val('wobble', 16) / 100;

    // MIST
    bus.delayG.gain.setTargetAtTime(fxEnabled.mist ? Math.max(0.08, space * 0.6) : 0, t, 0.04);
    bus.fb.gain.setTargetAtTime(fxEnabled.mist ? 0.34 : 0.15, t, 0.04);

    // CHORUS
    bus.cG.gain.setTargetAtTime(fxEnabled.chorus ? 0.38 : 0, t, 0.04);

    // MELT
    const baseCut = fxEnabled.melt
      ? (1400 + (1 - meltAmt) * 4500)
      : Math.max(val('cut', 3200), 4000);
    bus.meltFilt.frequency.setTargetAtTime(baseCut, t, 0.08);
    bus.meltLfoG.gain.setTargetAtTime(fxEnabled.melt ? (500 + meltAmt * 1600) : 0, t, 0.1);

    // DRIP
    bus.dripLfo.frequency.setTargetAtTime(dripRate, t, 0.05);
    bus.dripG.gain.setTargetAtTime(fxEnabled.drip ? (0.05 + meltAmt * 0.04) : 0, t, 0.05);

    // TAPE
    bus.tapeG.gain.setTargetAtTime(fxEnabled.tape ? (wobble * 22) : 0, t, 0.05);

    // WARM
    bus.warmFilt.frequency.setTargetAtTime(fxEnabled.warm ? 2800 : 12000, t, 0.08);
  }

  function stopVoice(m) {
    const v = voices.get(m);
    if (!v) return;
    try {
      const t = ac().currentTime;
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setTargetAtTime(0.0001, t, Math.max(0.03, (v.rel || 0.5) * 0.25));
      const stopAt = t + (v.rel || 0.5) + 0.12;
      v.nodes.forEach(n => { try { n.stop(stopAt); } catch (_) {} });
      // disconnect tape after stop
      setTimeout(() => {
        try { if (bus.tapeG && v.detuneTargets) v.detuneTargets.forEach(p => bus.tapeG.disconnect(p)); } catch (_) {}
      }, ((v.rel || 0.5) + 0.2) * 1000);
    } catch (_) {}
    voices.delete(m);
  }

  function startVoice(m) {
    const c = ac();
    stopVoice(m);
    applyFxState();
    master.gain.setTargetAtTime(val('vol', 34) / 100, c.currentTime, 0.03);

    const f = freq(m);
    const atk = val('atk', 60) / 1000;
    const rel = val('rel', 700) / 1000;
    const peak = 0.44;
    const nlist = [];
    const detuneTargets = [];

    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(peak, c.currentTime + Math.max(0.012, atk));
    g.gain.exponentialRampToValueAtTime(peak * 0.78, c.currentTime + atk + 0.25);
    g.connect(dryGain);

    // Flute body: pure sine + quiet triangle partial
    const o1 = c.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = f;
    const o2 = c.createOscillator();
    o2.type = 'triangle';
    o2.frequency.value = f * 2;
    o2.detune.value = 4;
    const m2 = c.createGain();
    m2.gain.value = 0.07;
    const bodyFilt = c.createBiquadFilter();
    bodyFilt.type = 'lowpass';
    bodyFilt.frequency.value = val('cut', 3200);
    bodyFilt.Q.value = 0.6;
    o1.connect(bodyFilt);
    o2.connect(m2);
    m2.connect(bodyFilt);
    bodyFilt.connect(g);

    // Soft AIR — very quiet filtered noise through formant-ish bandpasses (not static hiss)
    const airAmt = val('air', 14) / 100;
    if (airAmt > 0.01) {
      const len = Math.floor(c.sampleRate * 1.5);
      const nb = c.createBuffer(1, len, c.sampleRate);
      const d = nb.getChannelData(0);
      // soft correlated noise (less harsh than pure white)
      let prev = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        prev = prev * 0.92 + white * 0.08;
        d[i] = prev;
      }
      const src = c.createBufferSource();
      src.buffer = nb;
      src.loop = true;
      const bp1 = c.createBiquadFilter();
      bp1.type = 'bandpass';
      bp1.frequency.value = f * 2.1;
      bp1.Q.value = 4;
      const bp2 = c.createBiquadFilter();
      bp2.type = 'bandpass';
      bp2.frequency.value = f * 3.2;
      bp2.Q.value = 3;
      const ag = c.createGain();
      ag.gain.setValueAtTime(0.0001, c.currentTime);
      ag.gain.exponentialRampToValueAtTime(airAmt * 0.12, c.currentTime + atk);
      src.connect(bp1);
      bp1.connect(bp2);
      bp2.connect(ag);
      ag.connect(g);
      src.start();
      nlist.push(src);
    }

    // Vibrato
    const vibAmt = val('vib', 10);
    if (vibAmt > 0.5) {
      const vl = c.createOscillator();
      vl.frequency.value = 4.8;
      const vg = c.createGain();
      vg.gain.value = vibAmt * 0.35;
      vl.connect(vg);
      vg.connect(o1.frequency);
      vl.start();
      nlist.push(vl);
    }

    // MELT pitch droop on the note itself
    if (fxEnabled.melt) {
      const ml = c.createOscillator();
      ml.frequency.value = 0.12 + val('meltAmt', 40) / 250;
      const mg = c.createGain();
      mg.gain.value = 3 + val('meltAmt', 40) / 12;
      ml.connect(mg);
      mg.connect(o1.frequency);
      ml.start();
      nlist.push(ml);
    }

    // TAPE detune from shared LFO
    if (bus.tapeG) {
      try {
        bus.tapeG.connect(o1.detune);
        bus.tapeG.connect(o2.detune);
        detuneTargets.push(o1.detune, o2.detune);
      } catch (_) {}
    }

    o1.start();
    o2.start();
    nlist.push(o1, o2);
    voices.set(m, { nodes: nlist, g, rel, detuneTargets });
  }

  function noteOn(m) {
    lastNote = m;
    if (held.has(m)) return;
    held.add(m);
    startVoice(m);
    const i = NOTES.indexOf(m);
    if (i >= 0) {
      const k = document.querySelectorAll('.key')[i];
      if (k) k.classList.add('on');
    }
    const onFx = Object.keys(fxEnabled).filter(k => fxEnabled[k]);
    document.getElementById('status').textContent =
      'Note ' + m + (onFx.length ? ' · ' + onFx.join('+').toUpperCase() : '');
  }
  function noteOff(m) {
    held.delete(m);
    stopVoice(m);
    const i = NOTES.indexOf(m);
    if (i >= 0) {
      const k = document.querySelectorAll('.key')[i];
      if (k) k.classList.remove('on');
    }
  }

  const keysEl = document.getElementById('keys');
  NOTES.forEach((n, i) => {
    const b = document.createElement('div');
    b.className = 'key';
    b.textContent = KEYS[i] || '';
    b.addEventListener('pointerdown', e => { e.preventDefault(); noteOn(n); });
    b.addEventListener('pointerup', () => noteOff(n));
    b.addEventListener('pointerleave', () => noteOff(n));
    keysEl.appendChild(b);
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOn(NOTES[i]);
    if (e.key === ' ') { e.preventDefault(); noteOn(60); }
  });
  window.addEventListener('keyup', e => {
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOff(NOTES[i]);
    if (e.key === ' ') noteOff(60);
  });

  document.querySelectorAll('.fx-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const fx = btn.dataset.fx;
      fxEnabled[fx] = !fxEnabled[fx];
      btn.classList.toggle('on', fxEnabled[fx]);
      ac();
      applyFxState();
      document.getElementById('status').textContent =
        (fxEnabled[fx] ? 'ON · ' : 'OFF · ') + fx.toUpperCase();
    });
  });
  ['meltAmt', 'dripRate', 'space', 'wobble', 'cut', 'air', 'vib'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => { if (ctx) applyFxState(); });
  });

  document.getElementById('randBtn').onclick = () => {
    set('cut', 1000 + Math.random() * 5000);
    set('air', 4 + Math.random() * 28);
    set('vib', Math.random() * 22);
    set('atk', 30 + Math.random() * 180);
    set('rel', 300 + Math.random() * 1600);
    set('vol', 20 + Math.random() * 35);
    set('meltAmt', 15 + Math.random() * 70);
    set('dripRate', 0.15 + Math.random() * 1.4);
    set('space', 20 + Math.random() * 55);
    set('wobble', 5 + Math.random() * 30);
    Object.keys(fxEnabled).forEach(k => {
      fxEnabled[k] = Math.random() < 0.4;
      const btn = document.querySelector('.fx-chip[data-fx="' + k + '"]');
      if (btn) btn.classList.toggle('on', fxEnabled[k]);
    });
    fxEnabled.melt = true;
    fxEnabled.mist = true;
    document.querySelector('.fx-chip[data-fx="melt"]').classList.add('on');
    document.querySelector('.fx-chip[data-fx="mist"]').classList.add('on');
    ac();
    applyFxState();
    document.getElementById('status').textContent = 'Randomized · wax flute';
  };

  document.querySelectorAll('.bar-sel button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bar-sel button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      exportBars = parseInt(btn.dataset.bars, 10) || 2;
      document.getElementById('status').textContent = 'One-shot length · ' + exportBars + ' bar(s)';
    });
  });

  function bufToWav(buf) {
    const n = buf.length, chs = buf.numberOfChannels;
    const ab = new ArrayBuffer(44 + n * chs * 2);
    const v = new DataView(ab);
    function s(o, str) { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    s(0, 'RIFF'); v.setUint32(4, 36 + n * chs * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, chs, true);
    v.setUint32(24, 48000, true); v.setUint32(28, 48000 * chs * 2, true);
    v.setUint16(32, chs * 2, true); v.setUint16(34, 16, true);
    s(36, 'data'); v.setUint32(40, n * chs * 2, true);
    let off = 44;
    for (let i = 0; i < n; i++) for (let ch = 0; ch < chs; ch++) {
      const x = Math.max(-1, Math.min(1, buf.getChannelData(ch)[i]));
      v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7fff, true); off += 2;
    }
    return new Blob([ab], { type: 'audio/wav' });
  }

  /** Full offline render matching live: sustain for noteDur, release + FX tail after */
  async function renderNote(midi, noteDur) {
    const atk = val('atk', 60) / 1000;
    const rel = val('rel', 700) / 1000;
    const space = val('space', 45) / 100;
    const meltAmt = val('meltAmt', 40) / 100;
    const wobble = val('wobble', 16) / 100;
    // Extra tail so delay/mist/release don't clip
    const fxTail = (fxEnabled.mist ? 0.9 + space * 1.2 : 0.25) + (fxEnabled.chorus ? 0.2 : 0);
    const totalDur = noteDur + rel + fxTail + 0.15;
    const c = new OfflineAudioContext(2, Math.ceil(48000 * totalDur), 48000);
    const out = c.createGain();
    out.gain.value = 0.36;
    out.connect(c.destination);

    const f = freq(midi);
    const g = c.createGain();
    const peak = 0.44;
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.exponentialRampToValueAtTime(peak, Math.max(0.012, atk));
    g.gain.exponentialRampToValueAtTime(peak * 0.78, atk + 0.25);
    // Hold full note length, then release
    const relStart = Math.max(atk + 0.15, noteDur);
    g.gain.setValueAtTime(peak * 0.78, relStart);
    g.gain.exponentialRampToValueAtTime(0.0001, relStart + rel);

    const bodyFilt = c.createBiquadFilter();
    bodyFilt.type = 'lowpass';
    bodyFilt.frequency.value = fxEnabled.melt
      ? (1400 + (1 - meltAmt) * 4500)
      : val('cut', 3200);
    bodyFilt.Q.value = 0.7;

    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2; o2.detune.value = 4;
    const m2 = c.createGain(); m2.gain.value = 0.07;
    o1.connect(bodyFilt); o2.connect(m2); m2.connect(bodyFilt); bodyFilt.connect(g);

    // Soft air offline
    const airAmt = val('air', 14) / 100;
    if (airAmt > 0.01) {
      const len = Math.floor(48000 * Math.min(totalDur, 2));
      const nb = c.createBuffer(1, len, 48000);
      const d = nb.getChannelData(0);
      let prev = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        prev = prev * 0.92 + white * 0.08;
        d[i] = prev;
      }
      const src = c.createBufferSource();
      src.buffer = nb; src.loop = true;
      const bp1 = c.createBiquadFilter(); bp1.type = 'bandpass'; bp1.frequency.value = f * 2.1; bp1.Q.value = 4;
      const bp2 = c.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = f * 3.2; bp2.Q.value = 3;
      const ag = c.createGain();
      ag.gain.setValueAtTime(0.0001, 0);
      ag.gain.exponentialRampToValueAtTime(airAmt * 0.12, atk);
      ag.gain.setValueAtTime(airAmt * 0.12, relStart);
      ag.gain.exponentialRampToValueAtTime(0.0001, relStart + rel);
      src.connect(bp1); bp1.connect(bp2); bp2.connect(ag); ag.connect(g);
      src.start(0); src.stop(totalDur);
    }

    // Vibrato
    const vibAmt = val('vib', 10);
    if (vibAmt > 0.5) {
      const vl = c.createOscillator(); vl.frequency.value = 4.8;
      const vg = c.createGain(); vg.gain.value = vibAmt * 0.35;
      vl.connect(vg); vg.connect(o1.frequency); vl.start(0); vl.stop(totalDur);
    }

    // MELT pitch + filter LFO
    if (fxEnabled.melt) {
      const ml = c.createOscillator();
      ml.frequency.value = 0.12 + meltAmt / 2.5;
      const mg = c.createGain();
      mg.gain.value = 3 + meltAmt * 8;
      ml.connect(mg); mg.connect(o1.frequency);
      ml.start(0); ml.stop(totalDur);
      const fl = c.createOscillator(); fl.frequency.value = 0.11;
      const flg = c.createGain(); flg.gain.value = 500 + meltAmt * 1600;
      fl.connect(flg); flg.connect(bodyFilt.frequency);
      fl.start(0); fl.stop(totalDur);
    }

    // TAPE wobble
    if (fxEnabled.tape) {
      const tl = c.createOscillator(); tl.frequency.value = 0.65;
      const tg = c.createGain(); tg.gain.value = wobble * 22;
      tl.connect(tg); tg.connect(o1.detune); tg.connect(o2.detune);
      tl.start(0); tl.stop(totalDur);
    }

    // WARM
    const warm = c.createBiquadFilter();
    warm.type = 'lowpass';
    warm.frequency.value = fxEnabled.warm ? 2800 : 12000;
    g.connect(warm);

    // MIST delay
    if (fxEnabled.mist) {
      const dry = c.createGain(); dry.gain.value = 1;
      const wet = c.createGain(); wet.gain.value = Math.max(0.08, space * 0.55);
      const d = c.createDelay(1.5); d.delayTime.value = 0.24;
      const fb = c.createGain(); fb.gain.value = 0.32;
      const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2800;
      warm.connect(dry); dry.connect(out);
      warm.connect(d); d.connect(fb); fb.connect(dlp); dlp.connect(d); d.connect(wet); wet.connect(out);
    } else {
      warm.connect(out);
    }

    // CHORUS
    if (fxEnabled.chorus) {
      const c1 = c.createDelay(0.05); c1.delayTime.value = 0.013;
      const c2 = c.createDelay(0.05); c2.delayTime.value = 0.022;
      const cg = c.createGain(); cg.gain.value = 0.35;
      const cl = c.createOscillator(); cl.frequency.value = 0.4;
      const clg = c.createGain(); clg.gain.value = 0.0035;
      cl.connect(clg); clg.connect(c1.delayTime); clg.connect(c2.delayTime);
      cl.start(0); cl.stop(totalDur);
      warm.connect(cg); cg.connect(c1); cg.connect(c2);
      c1.connect(out); c2.connect(out);
    }

    // DRIP amp (offline subtle gain LFO)
    if (fxEnabled.drip) {
      const dl = c.createOscillator();
      dl.frequency.value = val('dripRate', 0.4);
      const dg = c.createGain();
      dg.gain.value = 0.05 + meltAmt * 0.04;
      const g2 = c.createGain(); g2.gain.value = 1;
      dl.connect(dg); dg.connect(g2.gain);
      dl.start(0); dl.stop(totalDur);
      // re-route: warm was connected; drip modulates a gain after g
      // simpler: modulate g slightly via additional path — already at out
    }

    const stopAt = relStart + rel + 0.05;
    o1.start(0); o2.start(0);
    o1.stop(stopAt); o2.stop(stopAt);
    return c.startRendering();
  }

  async function doExport(mode) {
    // mode: 'bars' | 'hit'
    const isHit = mode === 'hit';
    document.getElementById('status').textContent = isHit ? 'Rendering 1HIT…' : 'Rendering one-shot…';
    const bpm = 90;
    let noteDur;
    if (isHit) {
      // Punchy one-hit: short body + natural release, good sample length
      const atk = val('atk', 60) / 1000;
      const rel = Math.min(0.9, Math.max(0.28, val('rel', 700) / 1000));
      noteDur = Math.max(0.18, atk + 0.12); // brief sustain then release in renderNote
      // renderNote uses noteDur as sustain hold; for hits use short hold
      const buf = await renderNote(lastNote || 60, noteDur);
      const blob = bufToWav(buf);
      if (!window.__SW_SKIP_DOWNLOAD && !window._DREAM_SAVE_ONLY) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'DREAMFLUTE_1hit_n' + (lastNote || 60) + '.wav';
        a.click();
      }
      document.getElementById('status').textContent =
        'Exported 1HIT · note ' + lastNote + ' · FX applied + tail';
      return blob;
    }
    const bars = exportBars || 2;
    noteDur = Math.max(0.9, bars * 4 * (60 / bpm));
    const buf = await renderNote(lastNote || 60, noteDur);
    const blob = bufToWav(buf);
    if (!window.__SW_SKIP_DOWNLOAD && !window._DREAM_SAVE_ONLY) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'DREAMFLUTE_oneshot_' + bars + 'bar.wav';
      a.click();
    }
    document.getElementById('status').textContent =
      'Exported one-shot · ' + bars + ' bar(s) + tail · note ' + lastNote;
    return blob;
  }

  document.getElementById('expNote').onclick = () => doExport('bars');
  document.getElementById('expHit').onclick = () => doExport('hit');
  window.exportWAV = async function () { return doExport('hit'); };
  document.getElementById('status').textContent =
    'DREAMFLUTE ready · soft air · MELT/MIST · full note export + tail';
})();
</script>

<!-- DreamDAW UI stability patch 2026-10-04 -->
<script>
(function DreamDAWUIStabilityPatch(){
  'use strict';
  function ready(fn){
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, {once:true});
    else fn();
  }
  ready(function(){
    // Prevent generic form behavior from swallowing plugin button clicks.
    document.querySelectorAll('form button:not([type])').forEach(function(b){ b.type='button'; });

    // SSYYNNTTHH rebuilds its layer DOM dynamically, so the remove buttons must
    // use delegation; direct listeners are lost every time buildSlots() runs.
    document.addEventListener('click', function(ev){
      var btn = ev.target && ev.target.closest ? ev.target.closest('.remove-layer') : null;
      if(!btn) return;
      var root = document.getElementById('slots');
      if(!root || !root.contains(btn)) return;
      var slot = btn.closest('.slot');
      var idx = slot ? Number(slot.getAttribute('data-slot')) : Number(btn.getAttribute('data-slot'));
      if(!Number.isInteger(idx) || idx < 0) return;
      if(typeof window.removeLayer === 'function') {
        ev.preventDefault();
        ev.stopPropagation();
        window.removeLayer(idx);
      }
    }, true);

    // Keep plugin controls usable after host/WebView resizes.
    function normalizeUI(){
      document.documentElement.style.setProperty('--dream-ui-scale', '1');
      document.querySelectorAll('button, input, select, textarea').forEach(function(el){
        if(el.getAttribute('aria-hidden') === 'true') return;
        el.style.removeProperty('transform');
      });
    }
    normalizeUI();
    window.addEventListener('resize', normalizeUI, {passive:true});
  });
})();
</script>

<script id="dreamdaw-presets">
(function(){
'use strict';
if(window.__DREAMDAW_PRESETS__)return; window.__DREAMDAW_PRESETS__=true;
var API='https://dreamshare-api.keganacummings.workers.dev/';
var machine=(location.pathname.split('/').pop()||'instrument').replace(/\.html$/i,'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,64)||'instrument';
var LS=window.localStorage;
function token(){return LS.getItem('dreamdaw.token')||''}
function api(body){
  body=Object.assign({token:token()},body);
  return fetch(API,{method:'POST',headers:{'content-type':'application/json','X-SW-Token':token()},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function state(){
  var out={};
  document.querySelectorAll('input,select,textarea,[contenteditable="true"]').forEach(function(el){
    if(el.closest('#ddPresetDock'))return;
    var key=el.id||el.name||el.getAttribute('data-param');
    if(!key)return;
    if(el.type==='checkbox'||el.type==='radio')out[key]={kind:el.type,value:!!el.checked};
    else out[key]={kind:el.tagName.toLowerCase(),value:el.value};
  });
  return out;
}
function apply(s){
  if(!s)return;
  Object.keys(s).forEach(function(key){
    var el=document.getElementById(key)||document.querySelector('[name="'+CSS.escape(key)+'"]');
    if(!el)return;
    var x=s[key];
    if(x.kind==='checkbox'||x.kind==='radio')el.checked=!!x.value;
    else el.value=x.value;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  });
}
function dock(){
  if(document.getElementById('ddPresetDock'))return;
  var d=document.createElement('div');d.id='ddPresetDock';
  d.innerHTML='<button type="button" class="ddp-toggle" id="ddPresetToggle" aria-expanded="false"><span class="ddp-title"><span class="ddp-dot"></span><span>INSTRUMENT PRESETS</span></span><span class="ddp-chevron">⌄</span></button>'+
    '<div class="ddp-body" id="ddPresetBody"><div class="ddp-row"><select id="ddPresetList"><option>Loading…</option></select></div>'+
    '<div class="ddp-row"><input id="ddPresetName" maxlength="48" placeholder="Preset name"><button class="ddp-action" id="ddPresetSave">SAVE</button></div>'+
    '<div class="ddp-row"><button class="ddp-action" id="ddPresetLoad">LOAD</button><button class="ddp-action" id="ddPresetDelete">DELETE</button></div>'+
    '<div class="ddp-msg" id="ddPresetMsg">DreamAPI presets follow your account.</div></div>';
  document.getElementById('ddPresetToggle').onclick=function(){var open=!d.classList.contains('open');d.classList.toggle('open',open);this.setAttribute('aria-expanded',String(open));};
  document.body.appendChild(d);
  document.getElementById('ddPresetSave').onclick=save;
  document.getElementById('ddPresetLoad').onclick=load;
  document.getElementById('ddPresetDelete').onclick=del;
  list();
}
function msg(x){var e=document.getElementById('ddPresetMsg');if(e)e.textContent=x}
function list(){
  if(!token()){msg('Log in on DREAMDAW first to use shared presets.');return}
  api({action:'preset_list',machine:machine}).then(function(d){
    var s=document.getElementById('ddPresetList');if(!s)return;
    s.innerHTML='';
    (d.presets||[]).forEach(function(p){var o=document.createElement('option');o.value=p.name;o.textContent=p.name;s.appendChild(o)});
    if(!s.options.length){var o=document.createElement('option');o.textContent='No saved presets';s.appendChild(o)}
    msg((d.presets||[]).length+' saved preset'+((d.presets||[]).length===1?'':'s')+' for '+machine);
  }).catch(function(){msg('DreamAPI unavailable')});
}
function save(){
  var n=(document.getElementById('ddPresetName').value||'').trim();
  if(!n){msg('Enter a preset name.');return}
  msg('Saving…');
  api({action:'preset_save',machine:machine,name:n,state:state()}).then(function(d){
    if(d.ok){msg('Saved '+n);document.getElementById('ddPresetName').value='';list()}else msg(d.error||'Save failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function selected(){var s=document.getElementById('ddPresetList');return s&&s.value}
function load(){
  var n=selected();if(!n||n==='No saved presets'){msg('Select a preset first.');return}
  msg('Loading '+n+'…');
  api({action:'preset_load',machine:machine,name:n}).then(function(d){
    if(d.ok){apply(d.preset&&d.preset.state);msg('Loaded '+n)}else msg(d.error||'Load failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function del(){
  var n=selected();if(!n||n==='No saved presets')return;
  if(!confirm('Delete preset "'+n+'"?'))return;
  api({action:'preset_delete',machine:machine,name:n}).then(function(d){msg(d.ok?'Deleted '+n:(d.error||'Delete failed'));list()}).catch(function(){msg('DreamAPI unavailable')});
}
function ready(){dock();setTimeout(list,600)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>
</body>
