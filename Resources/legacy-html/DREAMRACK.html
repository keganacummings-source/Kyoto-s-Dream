  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #121218;
      --panel-2: #1a1a22;
      --accent: #c8ff4a;
      --accent-dim: #7a9a2a;
      --accent-bright: #e8ff8a;
      --text: #eef0e6;
      --text-dim: #8a9078;
      --border: #2a2e24;
      --radius: 6px;
      --font: 'Share Tech Mono', ui-monospace, monospace;
      --kick: #c8ff4a;
      --snare: #ff6b8a;
      --hat: #6bc8ff;
      --clap: #ffb86b;
      --perc: #c89bff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: transparent;
      color: var(--text);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .app {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .hdr {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel) 100%);
      flex-shrink: 0;
    }
    h1 {
      font-family: VT323, var(--font);
      font-size: 1.85rem;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
      margin: 0;
      line-height: 1;
    }
    .sub {
      color: var(--text-dim);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      flex: 1 1 140px;
    }
    .hdr-actions { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    button, select, input[type=number] {
      font-family: inherit;
      font-size: 0.7rem;
      min-height: 34px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent-dim); color: var(--text); }
    button.on {
      background: color-mix(in srgb, var(--accent) 28%, var(--panel-2));
      border-color: var(--accent);
      color: var(--accent-bright);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    button.primary {
      background: color-mix(in srgb, var(--accent) 22%, var(--panel-2));
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    label.inline {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.64rem; color: var(--text-dim);
    }
    input[type=range] { width: 90px; accent-color: var(--accent); }
    input[type=number] { width: 56px; }
    .body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(280px, 1.35fr) minmax(160px, 0.85fr);
      gap: 0;
    }
    .section-title {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-dim);
      padding: 6px 10px 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }
    .seq-wrap {
      min-height: 260px;
      overflow: auto;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 40% at 10% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%);
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 8px 10px;
      flex: 1;
    }
    .lane {
      display: grid;
      grid-template-columns: 76px 28px 28px 64px 36px 26px minmax(70px, 1fr) repeat(16, minmax(14px, 1fr));
      gap: 3px;
      align-items: center;
      min-height: 36px;
      padding: 2px 0;
      border-radius: 4px;
    }
    .lane:hover { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
    .lane .name {
      font-family: VT323, var(--font);
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lane.kick .name { color: var(--kick); }
    .lane.snare .name, .lane.rim .name { color: var(--snare); }
    .lane.chh .name, .lane.ohh .name, .lane.shaker .name { color: var(--hat); }
    .lane.clap .name, .lane.hit .name { color: var(--clap); }
    .lane.perc1 .name, .lane.perc2 .name, .lane.fx .name, .lane.tom .name { color: var(--perc); }
    .sample-label {
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 7px;
      min-height: 32px;
      display: flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      max-width: 100%;
      font-family: VT323, var(--font);
    }
    .sample-label.has {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
      color: var(--accent-bright);
      text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .sample-label:hover { border-color: var(--accent); }
    .step {
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      min-width: 0;
      transition: background 0.08s, box-shadow 0.08s;
    }
    .step:hover { border-color: var(--accent-dim); }
    .step.on {
      background: var(--accent);
      border-color: var(--accent-bright);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .lane.snare .step.on, .lane.rim .step.on { background: var(--snare); border-color: var(--accent-bright); box-shadow: 0 0 10px color-mix(in srgb, var(--snare) 40%, transparent); }
    .lane.chh .step.on, .lane.ohh .step.on, .lane.shaker .step.on { background: var(--hat); border-color: var(--accent-bright); box-shadow: 0 0 10px color-mix(in srgb, var(--hat) 40%, transparent); }
    .lane.clap .step.on, .lane.hit .step.on { background: var(--clap); border-color: var(--accent-bright); box-shadow: 0 0 10px color-mix(in srgb, var(--clap) 40%, transparent); }
    .lane.perc1 .step.on, .lane.perc2 .step.on, .lane.fx .step.on, .lane.tom .step.on { background: var(--perc); border-color: var(--text); box-shadow: 0 0 10px color-mix(in srgb, var(--perc) 40%, transparent); }
    .step.ghost {
      background: transparent;
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .step.play { outline: 2px solid var(--text); outline-offset: -1px; }
    .icon-btn {
      min-height: 28px;
      min-width: 28px;
      padding: 2px;
      font-size: 0.62rem;
    }
    .fxbtn { font-size: 0.58rem; min-width: 34px; }
    .fxbtn.on, .mute.on, .solo.on {
      background: color-mix(in srgb, var(--accent) 30%, var(--panel-2));
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .vol { width: 100%; min-height: 22px; accent-color: var(--accent); }
    .browser {
      min-height: 140px;
      max-height: 42vh;
      display: flex;
      flex-direction: column;
      background: var(--panel-2);
      overflow: hidden;
    }
    .browser-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .browser-bar .chip {
      font-size: 0.64rem;
      padding: 5px 10px;
      min-height: 28px;
    }
    .browser-bar .chip.on {
      background: color-mix(in srgb, var(--accent) 25%, var(--panel-2));
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .browser-search {
      flex: 1 1 120px;
      min-height: 28px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 4px 8px;
    }
    .kit-card, .smp-card {
      background: linear-gradient(165deg, color-mix(in srgb, var(--panel) 70%, var(--panel)) 0%, var(--panel) 100%);
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--border));
      border-radius: 10px;
      padding: 10px 10px 8px;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s, transform 0.1s, background 0.12s;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      overflow: hidden;
    }
    .kit-card::before, .smp-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: color-mix(in srgb, var(--accent) 55%, transparent);
      opacity: 0.7;
    }
    .kit-card:hover, .smp-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 22%, transparent);
      transform: translateY(-2px);
      background: linear-gradient(165deg, color-mix(in srgb, var(--accent) 12%, var(--panel)) 0%, var(--panel) 100%);
    }
    .kit-card .k-name, .smp-card .s-name {
      font-family: VT323, var(--font);
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 6px;
    }
    .kit-card .k-meta, .smp-card .s-meta {
      font-size: 0.62rem;
      color: var(--text-dim);
      padding-left: 6px;
      letter-spacing: 0.03em;
    }
    .kit-card .k-tag, .smp-card .s-tag {
      align-self: flex-start;
      margin-left: 6px;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      color: var(--accent-bright);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .smp-card.session {
      border-color: color-mix(in srgb, var(--accent-bright) 35%, var(--border));
    }
    .smp-card.session::before { background: var(--accent-bright); }
    .smp-card.session .s-name { color: var(--text); }
    .smp-card.session .s-tag {
      border-color: color-mix(in srgb, var(--accent-bright) 40%, var(--border));
      color: var(--accent-bright);
      background: rgba(80, 160, 220, 0.12);
    }
    .browser-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .empty-browse {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.72rem;
      padding: 24px;
    }
    .status {
      font-size: 0.64rem;
      color: var(--text-dim);
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--panel-2);
    }
    .assign-hint {
      font-size: 0.64rem;
      color: var(--accent-dim);
      padding: 0 10px 4px;
    }
    @media (max-width: 720px) {
      .lane {
        grid-template-columns: 56px 24px 24px 52px 32px 24px minmax(56px, 1fr) repeat(16, minmax(12px, 1fr));
      }
      .lane .name { font-size: 0.9rem; }
      .sample-label { font-size: 0.7rem; }
      h1 { font-size: 1.5rem; }
      .body { grid-template-rows: minmax(240px, 1.3fr) minmax(140px, 0.8fr); }
    }
  </style>

<script id="dreamdaw-ui-bridge">
(function(){
  window.__SW_SKIP_DOWNLOAD=true;
  window._DREAM_SAVE_ONLY=true;
  function isSoundSaveControl(el){
    if(!el||el.nodeType!==1)return false;
    var t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim().toLowerCase();
    return /\b(export|save)\b/.test(t) && /\b(wav|audio|sound|sample|tape|session|one[- ]shot|stem|note|4 bar|8 bar)\b/.test(t);
  }
  function scrub(root){(root||document).querySelectorAll('button,a,[role="button"]').forEach(function(el){if(isSoundSaveControl(el))el.remove();});}
  function bindDrop(input){
    if(!input||input.__dreamDropBound)return; input.__dreamDropBound=true;
    var target=input.closest('label,.dropzone,[data-drop],.slot,.sample-slot,.sample-pad,.track,.lane')||input.parentElement||input;
    ['dragenter','dragover'].forEach(function(ev){target.addEventListener(ev,function(e){if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();e.stopPropagation();target.classList.add('sw-drop-active');},{passive:false});});
    ['dragleave','drop'].forEach(function(ev){target.addEventListener(ev,function(e){if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}}target.classList.remove('sw-drop-active');},{passive:false});});
  }
  function init(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}
  document.addEventListener('DOMContentLoaded',init);
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);});}).observe(document.documentElement,{subtree:true,childList:true});})();
})();

<script id="dreamdaw-clean-runtime">
(function(){
  'use strict';
  function setKnob(input){
    if(!input||input.type!=='range')return;
    var min=parseFloat(input.min), max=parseFloat(input.max), val=parseFloat(input.value);
    if(!isFinite(min))min=0;if(!isFinite(max)||max<=min)max=100;if(!isFinite(val))val=min;
    var p=Math.max(0,Math.min(75,(val-min)/(max-min)*75));
    input.style.setProperty('--knob-p',p.toFixed(2));
    var wrap=input.parentElement&&input.parentElement.classList.contains('knob-wrap')?input.parentElement:null;
    if(wrap){var v=wrap.querySelector('.knob-value');if(v){var nt=String(Math.abs(val)>=100?Math.round(val):Number(val.toFixed(2)));if(v.textContent!==nt)v.textContent=nt;}}
  }
  function enhance(root){
    (root||document).querySelectorAll('input[type=range]').forEach(function(input){
      if(input.dataset.dreamKnob==='1'){setKnob(input);return;}
      input.dataset.dreamKnob='1';
      var parent=input.parentElement;
      if(parent && parent.classList.contains('knob-wrap')){setKnob(input);return;}
      var wrap=document.createElement('span');wrap.className='knob-wrap';
      input.replaceWith(wrap);wrap.appendChild(input);
      var value=document.createElement('span');value.className='knob-value';wrap.appendChild(value);
      input.addEventListener('input',function(){setKnob(input)},{passive:true});
      input.addEventListener('change',function(){setKnob(input)},{passive:true});
      setKnob(input);
    });
  }
  function cleanLearning(){
    document.querySelectorAll('.learn-btn,.learn-dock,#learnBtn,#learnBtnB,#learnDock').forEach(function(el){el.setAttribute('aria-hidden','true');});
  }
  function requestFit(){
    try{
      var r=document.documentElement.getBoundingClientRect();
      var w=Math.max(420,Math.ceil(r.width||document.body.scrollWidth||0));
      var h=Math.max(260,Math.ceil(r.height||document.body.scrollHeight||0));
      if(window.__JUCE__&&window.__JUCE__.backend){
        try{window.__JUCE__.backend.emitEvent('requestResize',{width:w,height:h});}catch(_){ }
        try{window.__JUCE__.backend.emitEvent('setSize',{width:w,height:h});}catch(_){ }
      }
      try{window.parent.postMessage({type:'DREAMDAW_RESIZE',width:w,height:h},'*');}catch(_){ }
    }catch(_){ }
  }

  function fitToHost(){
    try{
      var app=document.querySelector('.app,.machine,.machine-shell'); if(!app) return;
      app.style.zoom='1';
      var aw=document.documentElement.clientWidth||window.innerWidth;
      var ah=document.documentElement.clientHeight||window.innerHeight;
      var sw=Math.max(app.scrollWidth,app.getBoundingClientRect().width);
      var sh=Math.max(app.scrollHeight,app.getBoundingClientRect().height);
      var scale=Math.min(1,(aw-4)/Math.max(1,sw),(ah-4)/Math.max(1,sh));
      if(scale<0.995) app.style.zoom=Math.max(.68,scale.toFixed(3));
      requestFit();
    }catch(_){}
  }

  function init(){enhance();cleanLearning();requestFit();fitToHost();setTimeout(requestFit,80);setTimeout(fitToHost,120);setTimeout(requestFit,300);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;enhance();cleanLearning();});}).observe(document.documentElement,{subtree:true,childList:true});})();
  window.addEventListener('resize',requestFit,{passive:true});
})();
</script>

<script>
(function () {
  const STEPS = 16;
  const FX_PRESETS = {
    kick: [
      { id: 'punch', name: 'Punch', apply: (c, src, g) => {
        const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 2800; filt.Q.value = 0.7;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.4); }
        sh.curve = curve;
        src.connect(filt); filt.connect(sh); sh.connect(g);
      }},
      { id: 'sub', name: 'Sub', apply: (c, src, g) => {
        const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 180; filt.Q.value = 1.2;
        const boost = c.createGain(); boost.gain.value = 1.15;
        src.connect(filt); filt.connect(boost); boost.connect(g);
        const dry = c.createGain(); dry.gain.value = 0.55;
        src.connect(dry); dry.connect(g);
      }},
      { id: 'click', name: 'Click', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 80;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.8); }
        sh.curve = curve;
        src.connect(hp); hp.connect(sh); sh.connect(g);
      }}
    ],
    snare: [
      { id: 'snap', name: 'Snap', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.5); }
        sh.curve = curve;
        src.connect(hp); hp.connect(sh); sh.connect(g);
      }},
      { id: 'room', name: 'Room', apply: (c, src, g) => {
        src.connect(g);
        try {
          const d = c.createDelay(0.4); d.delayTime.value = 0.045;
          const dg = c.createGain(); dg.gain.value = 0.22;
          const fb = c.createGain(); fb.gain.value = 0.18;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
          src.connect(dg); dg.connect(d); d.connect(fb); fb.connect(lp); lp.connect(d); d.connect(g);
        } catch (_) {}
      }},
      { id: 'tight', name: 'Tight', apply: (c, src, g) => {
        const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 1.4;
        const dry = c.createGain(); dry.gain.value = 0.7;
        src.connect(bp); bp.connect(g);
        src.connect(dry); dry.connect(g);
      }}
    ],
    clap: [
      { id: 'wide', name: 'Wide', apply: (c, src, g) => {
        src.connect(g);
        try {
          const d = c.createDelay(0.3); d.delayTime.value = 0.028;
          const dg = c.createGain(); dg.gain.value = 0.35;
          src.connect(dg); dg.connect(d); d.connect(g);
        } catch (_) {}
      }},
      { id: 'crisp', name: 'Crisp', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.6); }
        sh.curve = curve;
        src.connect(hp); hp.connect(sh); sh.connect(g);
      }},
      { id: 'verb', name: 'Verb', apply: (c, src, g) => {
        src.connect(g);
        try {
          const d = c.createDelay(0.5); d.delayTime.value = 0.08;
          const dg = c.createGain(); dg.gain.value = 0.28;
          const fb = c.createGain(); fb.gain.value = 0.25;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3500;
          src.connect(dg); dg.connect(d); d.connect(fb); fb.connect(lp); lp.connect(d); d.connect(g);
        } catch (_) {}
      }}
    ],
    hat: [
      { id: 'air', name: 'Air', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
        src.connect(hp); hp.connect(g);
      }},
      { id: 'sizzle', name: 'Sizzle', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.3); }
        sh.curve = curve;
        src.connect(hp); hp.connect(sh); sh.connect(g);
      }},
      { id: 'dark', name: 'Dark', apply: (c, src, g) => {
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
        src.connect(lp); lp.connect(g);
      }}
    ],
    perc: [
      { id: 'ring', name: 'Ring', apply: (c, src, g) => {
        const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2.5;
        const dry = c.createGain(); dry.gain.value = 0.65;
        src.connect(bp); bp.connect(g);
        src.connect(dry); dry.connect(g);
      }},
      { id: 'soft', name: 'Soft', apply: (c, src, g) => {
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
        src.connect(lp); lp.connect(g);
      }},
      { id: 'echo', name: 'Echo', apply: (c, src, g) => {
        src.connect(g);
        try {
          const d = c.createDelay(0.4); d.delayTime.value = 0.09;
          const dg = c.createGain(); dg.gain.value = 0.2;
          src.connect(dg); dg.connect(d); d.connect(g);
        } catch (_) {}
      }}
    ],
    default: [
      { id: 'warm', name: 'Warm', apply: (c, src, g) => {
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5500;
        const sh = c.createWaveShaper();
        const curve = new Float32Array(128);
        for (let i = 0; i < 128; i++) { const x = (i / 64) - 1; curve[i] = Math.tanh(x * 1.2); }
        sh.curve = curve;
        src.connect(lp); lp.connect(sh); sh.connect(g);
      }},
      { id: 'bright', name: 'Bright', apply: (c, src, g) => {
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 250;
        src.connect(hp); hp.connect(g);
      }},
      { id: 'space', name: 'Space', apply: (c, src, g) => {
        src.connect(g);
        try {
          const d = c.createDelay(0.5); d.delayTime.value = 0.12;
          const dg = c.createGain(); dg.gain.value = 0.2;
          const fb = c.createGain(); fb.gain.value = 0.2;
          src.connect(dg); dg.connect(d); d.connect(fb); fb.connect(d); d.connect(g);
        } catch (_) {}
      }}
    ]
  };
  function fxFamily(id) {
    if (id === 'kick' || id === 'tom') return 'kick';
    if (id === 'snare' || id === 'rim') return 'snare';
    if (id === 'clap' || id === 'hit') return 'clap';
    if (id === 'chh' || id === 'ohh' || id === 'shaker') return 'hat';
    if (id === 'perc1' || id === 'perc2' || id === 'fx') return 'perc';
    return 'default';
  }
  const TRACKS = [
    { id: 'kick',   name: 'KICK',   def: 'kick_01_dry.wav' },
    { id: 'snare',  name: 'SNARE',  def: 'snare_01_dry.wav' },
    { id: 'clap',   name: 'CLAP',   def: 'clap_01_dry.wav' },
    { id: 'chh',    name: 'CH HAT', def: 'closedhat_01_dry.wav' },
    { id: 'ohh',    name: 'OP HAT', def: 'openhat_01_dry.wav' },
    { id: 'perc1',  name: 'PERC 1', def: 'perc_01_dry.wav' },
    { id: 'perc2',  name: 'PERC 2', def: 'perc_03_wet.wav' },
    { id: 'rim',    name: 'RIM',    def: 'snare_03_dry.wav' },
    { id: 'tom',    name: 'TOM',    def: 'kick_03_dry.wav' },
    { id: 'hit',    name: 'HIT',    def: 'clap_05_wet.wav' },
    { id: 'shaker', name: 'SHAKER', def: 'closedhat_05_wet.wav' },
    { id: 'fx',     name: 'FX',     def: 'perc_06_wet.wav' }
  ];
  const FALLBACK_KITS = [
    '../samples/DreamDrums/CLANKER/',
    '../samples/DreamDrums/PERKS/',
    '../samples/DreamDrums/CRUNCH/',
    '../samples/DreamDrums/HEAVY/',
    '../samples/DreamDrums/LIQUID/'
  ];
  const KIT_NAMES = ['CLANKER', 'PERKS', 'CRUNCH', 'HEAVY', 'LIQUID'];
  let ctx, master, buffers = {}, playing = false, step = 0, timer = null;
  let nextNoteTime = 0;
  const activeSrcs = new Set();
  const MAX_VOICES = 48;
  let curPat = 'A', chain = false;
  const pats = { A: emptyPat(), B: emptyPat() };
  const mute = {}, solo = {}, volumes = {}, customUrl = {}, sampleNames = {};
  const fxOn = {}, fxPreset = {};
  let armedTrack = null;
  let browseSrc = 'kits';
  let allSamples = [];
  function emptyPat() {
    const p = {};
    TRACKS.forEach(t => { p[t.id] = Array(STEPS).fill(0); });
    return p;
  }
  function ac() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.50;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function setStatus(t) {
    const el = document.getElementById('status');
    if (el) el.textContent = t;
  }
  async function loadUrl(url) {
    try {
      const r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      const ab = await r.arrayBuffer();
      return await ac().decodeAudioData(ab.slice(0));
    } catch (_) { return null; }
  }
  async function ensureSample(track) {
    if (buffers[track.id]) return buffers[track.id];
    if (customUrl[track.id]) {
      const b = await loadUrl(customUrl[track.id]);
      if (b) { buffers[track.id] = b; return b; }
    }
    for (const base of FALLBACK_KITS) {
      const b = await loadUrl(base + track.def);
      if (b) {
        buffers[track.id] = b;
        customUrl[track.id] = base + track.def;
        sampleNames[track.id] = track.def.replace(/\.wav$/i, '');
        return b;
      }
    }
    return null;
  }
  function playSample(trackId, vel, when, offlineCtx, offlineDest) {
    const buf = buffers[trackId];
    if (!buf) return;
    const c = offlineCtx || ac();
    // Live path: cull oldest sources if too many (prevents audio graph explosion)
    if (!offlineCtx && activeSrcs.size >= MAX_VOICES) {
      const oldest = activeSrcs.values().next().value;
      if (oldest) {
        try { oldest.stop(0); } catch (_) {}
        try { oldest.disconnect(); } catch (_) {}
        activeSrcs.delete(oldest);
      }
    }
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    const v = (volumes[trackId] != null ? volumes[trackId] : 0.62) * (vel || 1);
    g.gain.value = Math.max(0.001, v);
    if (fxOn[trackId]) {
      const fam = fxFamily(trackId);
      const list = FX_PRESETS[fam] || FX_PRESETS.default;
      const idx = fxPreset[trackId] != null ? fxPreset[trackId] % list.length : 0;
      try { list[idx].apply(c, src, g); }
      catch (_) { src.connect(g); }
    } else {
      src.connect(g);
    }
    g.connect(offlineDest || master);
    const startAt = when != null ? when : c.currentTime;
    try {
      src.start(startAt);
      if (!offlineCtx) {
        activeSrcs.add(src);
        src.onended = () => {
          activeSrcs.delete(src);
          try { src.disconnect(); } catch (_) {}
          try { g.disconnect(); } catch (_) {}
        };
      }
    } catch (_) {}
  }
  function isAudible(id) {
    const anySolo = TRACKS.some(t => solo[t.id]);
    if (anySolo) return !!solo[id];
    return !mute[id];
  }
  function scheduleStep(s, when, offlineCtx, offlineDest) {
    TRACKS.forEach(t => {
      const v = pats[curPat][t.id][s];
      if (!v || !isAudible(t.id)) return;
      playSample(t.id, v === 2 ? 0.35 : 1, when, offlineCtx, offlineDest);
    });
  }
  function stepDuration(bpm, swing, s) {
    const base = (60 / bpm) / 4;
    return base * ((s % 2) === 1 ? (1 + swing / 100) : (1 - swing / 200));
  }
  function scheduler() {
    if (!playing) return;
    const c = ac();
    const bpm = Math.max(60, Math.min(200, parseFloat(document.getElementById('bpm').value) || 110));
    const swing = parseFloat(document.getElementById('swing').value) || 0;
    const horizon = 0.12; // schedule ~120ms ahead
    while (nextNoteTime < c.currentTime + horizon) {
      document.querySelectorAll('.step.play').forEach(el => el.classList.remove('play'));
      document.querySelectorAll('.step[data-s="' + step + '"]').forEach(el => el.classList.add('play'));
      scheduleStep(step, nextNoteTime);
      nextNoteTime += stepDuration(bpm, swing, step);
      step = (step + 1) % STEPS;
      if (step === 0 && chain) {
        curPat = curPat === 'A' ? 'B' : 'A';
        document.getElementById('patA').classList.toggle('on', curPat === 'A');
        document.getElementById('patB').classList.toggle('on', curPat === 'B');
        paintSteps();
      }
    }
    timer = setTimeout(scheduler, 25);
  }
  function stop() {
    playing = false;
    clearTimeout(timer);
    timer = null;
    // stop all live voices cleanly
    activeSrcs.forEach(src => {
      try { src.stop(0); } catch (_) {}
      try { src.disconnect(); } catch (_) {}
    });
    activeSrcs.clear();
    document.getElementById('play').classList.remove('on');
    document.querySelectorAll('.step.play').forEach(el => el.classList.remove('play'));
    setStatus('Stopped');
  }
  function paintSteps() {
    TRACKS.forEach(t => {
      for (let s = 0; s < STEPS; s++) {
        const el = document.querySelector('.step[data-t="' + t.id + '"][data-s="' + s + '"]');
        if (!el) continue;
        const v = pats[curPat][t.id][s];
        el.classList.toggle('on', v === 1);
        el.classList.toggle('ghost', v === 2);
      }
    });
  }
  function updateFxButton(t) {
    const btn = document.querySelector('.fxbtn[data-t="' + t.id + '"]');
    if (!btn) return;
    btn.classList.toggle('on', !!fxOn[t.id]);
    if (fxOn[t.id]) {
      const list = FX_PRESETS[fxFamily(t.id)] || FX_PRESETS.default;
      const idx = (fxPreset[t.id] || 0) % list.length;
      btn.textContent = list[idx].name;
    } else btn.textContent = 'FX';
  }
  function updateSampleLabel(t) {
    const el = document.querySelector('.sample-label[data-t="' + t.id + '"]');
    if (!el) return;

    const stepDur = (60 / bpm) / 4;

    // Keep plugin controls usable after host/WebView resizes.
    function normalizeUI(){
      document.documentElement.style.setProperty('--dream-ui-scale', '1');
      document.querySelectorAll('button, input, select, textarea').forEach(function(el){
        if(el.getAttribute('aria-hidden') === 'true') return;
        el.style.removeProperty('transform');
      });
    }
    normalizeUI();
    window.addEventListener('resize', normalizeUI, {passive:true});
  });
})();
</script>

<script id="dreamdaw-presets">
(function(){
'use strict';
if(window.__DREAMDAW_PRESETS__)return; window.__DREAMDAW_PRESETS__=true;
var API='https://dreamshare-api.keganacummings.workers.dev/';
var machine=(location.pathname.split('/').pop()||'instrument').replace(/\.html$/i,'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,64)||'instrument';
var LS=window.localStorage;
function token(){return LS.getItem('dreamdaw.token')||''}
function api(body){
  body=Object.assign({token:token()},body);
  return fetch(API,{method:'POST',headers:{'content-type':'application/json','X-SW-Token':token()},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function state(){
  var out={};
  document.querySelectorAll('input,select,textarea,[contenteditable="true"]').forEach(function(el){
    if(el.closest('#ddPresetDock'))return;
    var key=el.id||el.name||el.getAttribute('data-param');
    if(!key)return;
    if(el.type==='checkbox'||el.type==='radio')out[key]={kind:el.type,value:!!el.checked};
    else out[key]={kind:el.tagName.toLowerCase(),value:el.value};
  });
  return out;
}
function apply(s){
  if(!s)return;
  Object.keys(s).forEach(function(key){
    var el=document.getElementById(key)||document.querySelector('[name="'+CSS.escape(key)+'"]');
    if(!el)return;
    var x=s[key];
    if(x.kind==='checkbox'||x.kind==='radio')el.checked=!!x.value;
    else el.value=x.value;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  });
}
function dock(){
  if(document.getElementById('ddPresetDock'))return;
  var d=document.createElement('div');d.id='ddPresetDock';
  d.innerHTML='<div class="ddp-head"><span>INSTRUMENT PRESETS</span><span class="ddp-dot"></span></div>'+
    '<div class="ddp-row"><select id="ddPresetList"><option>Loading…</option></select></div>'+
    '<div class="ddp-row"><input id="ddPresetName" maxlength="48" placeholder="Preset name"><button id="ddPresetSave">SAVE</button></div>'+
    '<div class="ddp-row"><button id="ddPresetLoad">LOAD</button><button id="ddPresetDelete">DELETE</button></div>'+
    '<div class="ddp-msg" id="ddPresetMsg">DreamAPI presets follow your account.</div>';
  document.body.appendChild(d);
  document.getElementById('ddPresetSave').onclick=save;
  document.getElementById('ddPresetLoad').onclick=load;
  document.getElementById('ddPresetDelete').onclick=del;
  list();
}
function msg(x){var e=document.getElementById('ddPresetMsg');if(e)e.textContent=x}
function list(){
  if(!token()){msg('Log in on DREAMDAW first to use shared presets.');return}
  api({action:'preset_list',machine:machine}).then(function(d){
    var s=document.getElementById('ddPresetList');if(!s)return;
    s.innerHTML='';
    (d.presets||[]).forEach(function(p){var o=document.createElement('option');o.value=p.name;o.textContent=p.name;s.appendChild(o)});
    if(!s.options.length){var o=document.createElement('option');o.textContent='No saved presets';s.appendChild(o)}
    msg((d.presets||[]).length+' saved preset'+((d.presets||[]).length===1?'':'s')+' for '+machine);
  }).catch(function(){msg('DreamAPI unavailable')});
}
function save(){
  var n=(document.getElementById('ddPresetName').value||'').trim();
  if(!n){msg('Enter a preset name.');return}
  msg('Saving…');
  api({action:'preset_save',machine:machine,name:n,state:state()}).then(function(d){
    if(d.ok){msg('Saved '+n);document.getElementById('ddPresetName').value='';list()}else msg(d.error||'Save failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function selected(){var s=document.getElementById('ddPresetList');return s&&s.value}
function load(){
  var n=selected();if(!n||n==='No saved presets'){msg('Select a preset first.');return}
  msg('Loading '+n+'…');
  api({action:'preset_load',machine:machine,name:n}).then(function(d){
    if(d.ok){apply(d.preset&&d.preset.state);msg('Loaded '+n)}else msg(d.error||'Load failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function del(){
  var n=selected();if(!n||n==='No saved presets')return;
  if(!confirm('Delete preset "'+n+'"?'))return;
  api({action:'preset_delete',machine:machine,name:n}).then(function(d){msg(d.ok?'Deleted '+n:(d.error||'Delete failed'));list()}).catch(function(){msg('DreamAPI unavailable')});
}
function ready(){dock();setTimeout(list,600)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>
</body>
