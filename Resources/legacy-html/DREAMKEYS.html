<script id="dreamdaw-ui-bridge">
(function(){
  window.__SW_SKIP_DOWNLOAD=true;
  window._DREAM_SAVE_ONLY=true;
  function isSoundSaveControl(el){
    if(!el||el.nodeType!==1)return false;
    var t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim().toLowerCase();
    return /\b(export|save)\b/.test(t) && /\b(wav|audio|sound|sample|tape|session|one[- ]shot|stem|note|4 bar|8 bar)\b/.test(t);
  }
  function scrub(root){(root||document).querySelectorAll('button,a,[role="button"]').forEach(function(el){if(isSoundSaveControl(el))el.remove();});}
  function bindDrop(input){
    if(!input||input.__dreamDropBound)return; input.__dreamDropBound=true;
    var target=input.closest('label,.dropzone,[data-drop],.slot,.sample-slot,.sample-pad,.track,.lane')||input.parentElement||input;
    ['dragenter','dragover'].forEach(function(ev){target.addEventListener(ev,function(e){if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();e.stopPropagation();target.classList.add('sw-drop-active');},{passive:false});});
    ['dragleave','drop'].forEach(function(ev){target.addEventListener(ev,function(e){if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}}target.classList.remove('sw-drop-active');},{passive:false});});
  }
  function init(){scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);}
  document.addEventListener('DOMContentLoaded',init);
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;scrub();document.querySelectorAll('input[type=file]').forEach(bindDrop);});}).observe(document.documentElement,{subtree:true,childList:true});})();
})();

<script id="dreamdaw-clean-runtime">
(function(){
  'use strict';
  function setKnob(input){
    if(!input||input.type!=='range')return;
    var min=parseFloat(input.min), max=parseFloat(input.max), val=parseFloat(input.value);
    if(!isFinite(min))min=0;if(!isFinite(max)||max<=min)max=100;if(!isFinite(val))val=min;
    var p=Math.max(0,Math.min(75,(val-min)/(max-min)*75));
    input.style.setProperty('--knob-p',p.toFixed(2));
    var wrap=input.parentElement&&input.parentElement.classList.contains('knob-wrap')?input.parentElement:null;
    if(wrap){var v=wrap.querySelector('.knob-value');if(v){var nt=String(Math.abs(val)>=100?Math.round(val):Number(val.toFixed(2)));if(v.textContent!==nt)v.textContent=nt;}}
  }
  function enhance(root){
    (root||document).querySelectorAll('input[type=range]').forEach(function(input){if(!window.__DD_KN||!(input.closest('.knob-wrap')||(input.parentElement&&window.__DD_KN.test(input.parentElement.textContent))))return;
      if(input.dataset.dreamKnob==='1'){setKnob(input);return;}
      input.dataset.dreamKnob='1';
      var parent=input.parentElement;
      if(parent && parent.classList.contains('knob-wrap')){setKnob(input);return;}
      var wrap=document.createElement('span');wrap.className='knob-wrap';
      input.replaceWith(wrap);wrap.appendChild(input);
      var value=document.createElement('span');value.className='knob-value';wrap.appendChild(value);
      input.addEventListener('input',function(){setKnob(input)},{passive:true});
      input.addEventListener('change',function(){setKnob(input)},{passive:true});
      setKnob(input);
    });
  }
  function cleanLearning(){
    document.querySelectorAll('.learn-btn,.learn-dock,#learnBtn,#learnBtnB,#learnDock').forEach(function(el){el.setAttribute('aria-hidden','true');});
  }
  function requestFit(){
    try{
      var r=document.documentElement.getBoundingClientRect();
      var w=Math.max(420,Math.ceil(r.width||document.body.scrollWidth||0));
      var h=Math.max(260,Math.ceil(r.height||document.body.scrollHeight||0));
      if(window.__JUCE__&&window.__JUCE__.backend){
        try{window.__JUCE__.backend.emitEvent('requestResize',{width:w,height:h});}catch(_){ }
        try{window.__JUCE__.backend.emitEvent('setSize',{width:w,height:h});}catch(_){ }
      }
      try{window.parent.postMessage({type:'DREAMDAW_RESIZE',width:w,height:h},'*');}catch(_){ }
    }catch(_){ }
  }

  function fitToHost(){
    try{
      var app=document.querySelector('.app,.machine,.machine-shell'); if(!app) return;
      app.style.zoom='1';
      var aw=document.documentElement.clientWidth||window.innerWidth;
      var ah=document.documentElement.clientHeight||window.innerHeight;
      var sw=Math.max(app.scrollWidth,app.getBoundingClientRect().width);
      var sh=Math.max(app.scrollHeight,app.getBoundingClientRect().height);
      var scale=Math.min(1,(aw-4)/Math.max(1,sw),(ah-4)/Math.max(1,sh));
      if(scale<0.995) app.style.zoom=Math.max(.68,scale.toFixed(3));
      requestFit();
    }catch(_){}
  }

  function init(){enhance();cleanLearning();requestFit();fitToHost();setTimeout(requestFit,80);setTimeout(fitToHost,120);setTimeout(requestFit,300);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  (function(){var q=false;new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;enhance();cleanLearning();});}).observe(document.documentElement,{subtree:true,childList:true});})();
  window.addEventListener('resize',requestFit,{passive:true});
})();
</script>

<body>
  <div class="app">
    <div class="top">
      <h1>DREAMKEYS</h1>
      <p class="sub">Electric keys · bell layer + soft</p>
      <button type="button" id="randBtn" title="Randomize parameters">RANDOM</button>
    </div>
    <div class="work">
      <div class="row">
        <label>CUTOFF<input id="cut" type="range" min="200" max="12000" value="2400"></label>
        <label>ATTACK<input id="atk" type="range" min="5" max="800" value="32"></label>
        <label>DECAY<input id="dec" type="range" min="40" max="2000" value="420"></label>
        <label>RELEASE<input id="rel" type="range" min="40" max="1500" value="720"></label>
        <label>LEVEL<input id="vol" type="range" min="4" max="80" value="20"></label>
        
        <label>BELL<input id="bell" type="range" min="0" max="50" value="24"></label>
        <label>SOFT<input id="soft" type="range" min="0" max="100" value="52"></label>

<script>
(function () {
  const NOTES = [60,62,64,65,67,69,71,72,74,76,77,79];
  const KEYS = 'awsedftgyhuj';
  let ctx, master, dest, voices = new Map(), held = new Set();
  function ac() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.18;
      const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 8000;
      master.connect(filt); filt.connect(ctx.destination);
      dest = master;
      window.__swFilt = filt;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function val(id, d) { const el = document.getElementById(id); return el ? parseFloat(el.value) : d; }
  function set(id, v) { const el = document.getElementById(id); if (el) el.value = v; }
  function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function envGain(c, a, d, s, peak) {
    const g = c.createGain();
    const t = c.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t + Math.max(0.005, a));
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak * s), t + a + d);
    return g;
  }
  function osc(c, type, f, det) {
    const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det || 0; return o;
  }
  function stopVoice(m) {
    const v = voices.get(m);
    if (!v) return;
    try {
      const t = ac().currentTime;
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setTargetAtTime(0.0001, t, 0.03);
      const rel = v.rel || 0.2;
      v.nodes.forEach(n => { try { n.stop(t + rel + 0.05); } catch(_){} });
    } catch(_){}
    voices.delete(m);
  }
  function startVoice(m) {
    const c = ac();
    stopVoice(m);
    const cut = val('cut', 3200);
    if (window.__swFilt) window.__swFilt.frequency.setTargetAtTime(cut, c.currentTime, 0.03);
    master.gain.setTargetAtTime(val('vol', 28) / 100, c.currentTime, 0.02);
    const nodes = [];
    const f = freq(m);
    const atk = val('atk', 12) / 1000;
    const dec = val('dec', 280) / 1000;
    const rel = val('rel', 180) / 1000;
    const peak = 0.45;
    const sus = 0.35;
    
    const soft = val('soft',40)/100;
    const g = envGain(c, 0.01 + soft*0.08, 0.3, 0.25, peak * 0.4);
    const o = osc(c, 'sine', f, 0);
    const o2 = osc(c, 'sine', f * 2.99, 4);
    const m2 = c.createGain(); m2.gain.value = val('bell',18)/100;
    o.connect(g); o2.connect(m2); m2.connect(g);
    g.connect(dest);
    nodes.push(o,o2); o.start(); o2.start();
    voices.set(m, { nodes, g, rel });

  }
  let lastNote = 60;
  function noteOn(m) {
    lastNote = m;
    if (held.has(m)) return;
    held.add(m);
    startVoice(m);
    const i = NOTES.indexOf(m);
    if (i >= 0) {
      const k = document.querySelectorAll('.key')[i];
      if (k) k.classList.add('on');
    }
  }
  function noteOff(m) {
    held.delete(m);
    stopVoice(m);
    const i = NOTES.indexOf(m);
    if (i >= 0) {
      const k = document.querySelectorAll('.key')[i];
      if (k) k.classList.remove('on');
    }
  }
  window.noteOn = noteOn; window.noteOff = noteOff; // DAW MIDI hook (DreamHost bridge)
  const keysEl = document.getElementById('keys');
  NOTES.forEach((n, i) => {
    const b = document.createElement('div');
    b.className = 'key';
    b.textContent = KEYS[i] || '';
    b.addEventListener('pointerdown', e => { e.preventDefault(); noteOn(n); });
    b.addEventListener('pointerup', () => noteOff(n));
    b.addEventListener('pointerleave', () => noteOff(n));
    keysEl.appendChild(b);
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOn(NOTES[i]);
    if (e.key === ' ') { e.preventDefault(); noteOn(60); }
  });
  window.addEventListener('keyup', e => {
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOff(NOTES[i]);
    if (e.key === ' ') noteOff(60);
  });
  document.getElementById('randBtn').addEventListener('click', () => {
    set('cut', 300 + Math.random() * 9000);
    set('atk', 5 + Math.random() * 200);
    set('dec', 60 + Math.random() * 900);
    set('rel', 40 + Math.random() * 800);
    set('vol', 12 + Math.random() * 50);
    set('bell',Math.random()*40); set('soft',Math.random()*80); set('atk',5+Math.random()*100);
    document.getElementById('status').textContent = 'Randomized · play a key';
  });

  async function renderNoteSample(midi, durSec) {
    const c = new OfflineAudioContext(2, Math.ceil(48000 * (durSec || 1.5)), 48000);
    // Rebuild a simplified version of current voice into offline context
    // We approximate by capturing current param state and using a clean osc path
    const peak = 0.4;
    const atk = val('atk', 12) / 1000;
    const dec = val('dec', 280) / 1000;
    const rel = val('rel', 180) / 1000;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const cut = val('cut', 3200);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.exponentialRampToValueAtTime(peak, Math.max(0.005, atk));
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak * 0.35), atk + dec);
    g.gain.exponentialRampToValueAtTime(0.0001, atk + dec + rel + 0.3);
    g.connect(c.destination);
    const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = cut;
    // Prefer connecting osc -> filt -> g for offline
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    o.connect(filt); filt.connect(g);
    o.start(0); o.stop(atk + dec + rel + 0.4);
    const buf = await c.startRendering();
    return buf;
  }

  async function renderLoop(bars) {
    const bpm = 120;
    const stepDur = (60 / bpm) / 4;
    const totalSteps = 16 * Math.max(1, bars || 4);
    const seconds = totalSteps * stepDur + 0.3;
    const c = new OfflineAudioContext(2, Math.ceil(48000 * seconds), 48000);
    const g = c.createGain(); g.gain.value = 0.35; g.connect(c.destination);
    const scale = [0, 2, 3, 5, 7, 8, 10, 12];
    for (let s = 0; s < totalSteps; s++) {
      if (s % 2 !== 0) continue; // 8ths
      const when = s * stepDur;
      const deg = scale[s % scale.length];
      const midi = 60 + deg;
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const eg = c.createGain();
      eg.gain.setValueAtTime(0.0001, when);
      eg.gain.exponentialRampToValueAtTime(0.35, when + 0.02);
      eg.gain.exponentialRampToValueAtTime(0.001, when + 0.25);
      const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = val('cut', 3200);
      o.connect(filt); filt.connect(eg); eg.connect(g);
      o.start(when); o.stop(when + 0.3);
    }
    return await c.startRendering();
  }

  function bufToWav(buf) {
    const n = buf.length, chs = buf.numberOfChannels;
    const ab = new ArrayBuffer(44 + n * chs * 2);
    const v = new DataView(ab);
    function s(o, str) { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    s(0, 'RIFF'); v.setUint32(4, 36 + n * chs * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, chs, true);
    v.setUint32(24, 48000, true); v.setUint32(28, 48000 * chs * 2, true); v.setUint16(32, chs * 2, true); v.setUint16(34, 16, true);
    s(36, 'data'); v.setUint32(40, n * chs * 2, true);
    let off = 44;
    for (let i = 0; i < n; i++) for (let ch = 0; ch < chs; ch++) {
      const x = Math.max(-1, Math.min(1, buf.getChannelData(ch)[i]));
      v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7fff, true); off += 2;
    }
    return new Blob([ab], { type: 'audio/wav' });
  }

  window.exportWAV = async function (mode) {
    // mode: 'note' | 'loop4' | 'loop8' | undefined (default note if recent key, else loop4)
    let buf;
    if (mode === 'loop4') buf = await renderLoop(4);
    else if (mode === 'loop8') buf = await renderLoop(8);
    else {
      // default: last played note as sample (with current cutoff/ADSR approx)
      buf = await renderNoteSample(lastNote || 60, 1.6);
    }
    const blob = bufToWav(buf);
    if (!window.__SW_SKIP_DOWNLOAD && !window._DREAM_SAVE_ONLY) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const tag = mode === 'loop4' ? '_loop4' : mode === 'loop8' ? '_loop8' : '_note';
      a.download = (document.title || 'stable').replace(/\s+/g, '') + tag + '.wav';
      a.click();
    }
    return blob;
  };

  // Extra export buttons if status row exists
  try {
    const st = document.getElementById('status');
    if (st && st.parentNode) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.marginTop = '4px';
      row.innerHTML = '<button type="button" id="expNote">EXPORT NOTE</button>' +
        '<button type="button" id="exp4">EXPORT 4 BAR</button>' +
        '<button type="button" id="exp8">EXPORT 8 BAR</button>';
      st.parentNode.insertBefore(row, st);
      document.getElementById('expNote').onclick = () => window.exportWAV('note');
      document.getElementById('exp4').onclick = () => window.exportWAV('loop4');
      document.getElementById('exp8').onclick = () => window.exportWAV('loop8');
    }
  } catch(_){}

})();
</script>

<!-- DreamDAW UI stability patch 2026-10-04 -->
<script>
(function DreamDAWUIStabilityPatch(){
  'use strict';
  function ready(fn){
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, {once:true});
    else fn();
  }
  ready(function(){
    // Prevent generic form behavior from swallowing plugin button clicks.
    document.querySelectorAll('form button:not([type])').forEach(function(b){ b.type='button'; });

    // SSYYNNTTHH rebuilds its layer DOM dynamically, so the remove buttons must
    // use delegation; direct listeners are lost every time buildSlots() runs.
    document.addEventListener('click', function(ev){
      var btn = ev.target && ev.target.closest ? ev.target.closest('.remove-layer') : null;
      if(!btn) return;
      var root = document.getElementById('slots');
      if(!root || !root.contains(btn)) return;
      var slot = btn.closest('.slot');
      var idx = slot ? Number(slot.getAttribute('data-slot')) : Number(btn.getAttribute('data-slot'));
      if(!Number.isInteger(idx) || idx < 0) return;
      if(typeof window.removeLayer === 'function') {
        ev.preventDefault();
        ev.stopPropagation();
        window.removeLayer(idx);
      }
    }, true);

    // Keep plugin controls usable after host/WebView resizes.
    function normalizeUI(){
      document.documentElement.style.setProperty('--dream-ui-scale', '1');
      document.querySelectorAll('button, input, select, textarea').forEach(function(el){
        if(el.getAttribute('aria-hidden') === 'true') return;
        el.style.removeProperty('transform');
      });
    }
    normalizeUI();
    window.addEventListener('resize', normalizeUI, {passive:true});
  });
})();
</script>

<script id="dreamdaw-presets">
(function(){
'use strict';
if(window.__DREAMDAW_PRESETS__)return; window.__DREAMDAW_PRESETS__=true;
var API='https://dreamshare-api.keganacummings.workers.dev/';
var machine=(location.pathname.split('/').pop()||'instrument').replace(/\.html$/i,'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,64)||'instrument';
var LS=window.localStorage;
function token(){return LS.getItem('dreamdaw.token')||''}
function api(body){
  body=Object.assign({token:token()},body);
  return fetch(API,{method:'POST',headers:{'content-type':'application/json','X-SW-Token':token()},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function state(){
  var out={};
  document.querySelectorAll('input,select,textarea,[contenteditable="true"]').forEach(function(el){
    if(el.closest('#ddPresetDock'))return;
    var key=el.id||el.name||el.getAttribute('data-param');
    if(!key)return;
    if(el.type==='checkbox'||el.type==='radio')out[key]={kind:el.type,value:!!el.checked};
    else out[key]={kind:el.tagName.toLowerCase(),value:el.value};
  });
  return out;
}
function apply(s){
  if(!s)return;
  Object.keys(s).forEach(function(key){
    var el=document.getElementById(key)||document.querySelector('[name="'+CSS.escape(key)+'"]');
    if(!el)return;
    var x=s[key];
    if(x.kind==='checkbox'||x.kind==='radio')el.checked=!!x.value;
    else el.value=x.value;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  });
}
function dock(){
  if(document.getElementById('ddPresetDock'))return;
  var d=document.createElement('div');d.id='ddPresetDock';
  d.innerHTML='<button type="button" class="ddp-toggle" id="ddPresetToggle" aria-expanded="false"><span class="ddp-title"><span class="ddp-dot"></span><span>INSTRUMENT PRESETS</span></span><span class="ddp-chevron">⌄</span></button>'+
    '<div class="ddp-body" id="ddPresetBody"><div class="ddp-row"><select id="ddPresetList"><option>Loading…</option></select></div>'+
    '<div class="ddp-row"><input id="ddPresetName" maxlength="48" placeholder="Preset name"><button class="ddp-action" id="ddPresetSave">SAVE</button></div>'+
    '<div class="ddp-row"><button class="ddp-action" id="ddPresetLoad">LOAD</button><button class="ddp-action" id="ddPresetDelete">DELETE</button></div>'+
    '<div class="ddp-msg" id="ddPresetMsg">DreamAPI presets follow your account.</div></div>';
  document.getElementById('ddPresetToggle').onclick=function(){var open=!d.classList.contains('open');d.classList.toggle('open',open);this.setAttribute('aria-expanded',String(open));};
  document.body.appendChild(d);
  document.getElementById('ddPresetSave').onclick=save;
  document.getElementById('ddPresetLoad').onclick=load;
  document.getElementById('ddPresetDelete').onclick=del;
  list();
}
function msg(x){var e=document.getElementById('ddPresetMsg');if(e)e.textContent=x}
function list(){
  if(!token()){msg('Log in on DREAMDAW first to use shared presets.');return}
  api({action:'preset_list',machine:machine}).then(function(d){
    var s=document.getElementById('ddPresetList');if(!s)return;
    s.innerHTML='';
    (d.presets||[]).forEach(function(p){var o=document.createElement('option');o.value=p.name;o.textContent=p.name;s.appendChild(o)});
    if(!s.options.length){var o=document.createElement('option');o.textContent='No saved presets';s.appendChild(o)}
    msg((d.presets||[]).length+' saved preset'+((d.presets||[]).length===1?'':'s')+' for '+machine);
  }).catch(function(){msg('DreamAPI unavailable')});
}
function save(){
  var n=(document.getElementById('ddPresetName').value||'').trim();
  if(!n){msg('Enter a preset name.');return}
  msg('Saving…');
  api({action:'preset_save',machine:machine,name:n,state:state()}).then(function(d){
    if(d.ok){msg('Saved '+n);document.getElementById('ddPresetName').value='';list()}else msg(d.error||'Save failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function selected(){var s=document.getElementById('ddPresetList');return s&&s.value}
function load(){
  var n=selected();if(!n||n==='No saved presets'){msg('Select a preset first.');return}
  msg('Loading '+n+'…');
  api({action:'preset_load',machine:machine,name:n}).then(function(d){
    if(d.ok){apply(d.preset&&d.preset.state);msg('Loaded '+n)}else msg(d.error||'Load failed');
  }).catch(function(){msg('DreamAPI unavailable')});
}
function del(){
  var n=selected();if(!n||n==='No saved presets')return;
  if(!confirm('Delete preset "'+n+'"?'))return;
  api({action:'preset_delete',machine:machine,name:n}).then(function(d){msg(d.ok?'Deleted '+n:(d.error||'Delete failed'));list()}).catch(function(){msg('DreamAPI unavailable')});
}
function ready(){dock();setTimeout(list,600)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>
